const noResults = document.getElementById('noResults');
let currentFilter = 'all';
let searchTerm = '';

function renderCards() {
  const filtered = quotes.filter((q, idx) => {
    const matchFilter = currentFilter === 'all' || q.tags.includes(currentFilter);
    const matchSearch = searchTerm === '' ||
      q.chinese.toLowerCase().includes(searchTerm) ||
      q.greek.toLowerCase().includes(searchTerm) ||
      q.translit.toLowerCase().includes(searchTerm) ||
      q.source.toLowerCase().includes(searchTerm) ||
      q.stephanus.toLowerCase().includes(searchTerm);
    return matchFilter && matchSearch;
  });

  if (filtered.length === 0) {
    container.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  container.innerHTML = filtered.map((q, idx) => `
    <div class="card" data-tags="${q.tags.join(',')}">
      <div class="card-number">${String(idx + 1).padStart(2, '0')}</div>
      <div class="greek-original">${q.greek}</div>
      <div class="transliteration">${q.translit}</div>
      <div class="chinese-translation">${q.chinese}</div>
      <div class="tags">${q.tags.map(t => `<span class="tag">${tagLabel(t)}</span>`).join('')}</div>
      <div class="source">
        <span class="source-text">📖 ${q.source}</span>
        <span class="stephanus">${q.stephanus}</span>
      </div>
    </div>
  `).join('');
}

function tagLabel(tag) {
  const labels = {
    self: '认识自我', virtue: '美德与智慧', examine: '省察与思辨',
    death: '生死与灵魂', justice: '正义与法律', education: '教育与求知',
    life: '生活与品格', love: '爱与美'
  };
  return labels[tag] || tag;
}

// Update counts
function updateCounts() {
  const allCount = document.getElementById('count-all');
  allCount.textContent = `(${quotes.length})`;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const filter = btn.dataset.filter;
    if (filter === 'all') return;
    const count = quotes.filter(q => q.tags.includes(filter)).length;
    const countSpan = btn.querySelector('.count');
    if (countSpan) countSpan.textContent = `(${count})`;
    else btn.insertAdjacentHTML('beforeend', ` <span class="count">(${count})</span>`);
  });
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  renderCards();
});

// Scroll to top
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTop');
  if (window.scrollY > 400) btn.classList.add('visible');
  else btn.classList.remove('visible');
});

// Init
updateCounts();
renderCards();
</script>
</body>
</html>
