{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'1小时前',src:'学而 1.1',o:'学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？',tr:'学了按时练习；远方来了朋友；别人不了解也不生气——这不正是君子的快乐吗？',img:'📚✨🏠',tags:['#学','#君子','#快乐'],li:['颜回','曾子','有子','子贡'],cs:[{n:'子路',t:'道理都懂，但我做不到不生气 😤'},{n:'孔子',t:'回复 子路：慢慢来，由也。'},{n:'颜回',t:'这句话够我琢磨一辈子 🙏'},{n:'子贡',t:'每次看都有新收获。收藏了！'}]},
{a:{n:'有子',e:'🦅',bg:'#5d4037'},ti:'1小时前',src:'学而 1.2',o:'其为人也孝弟，而好犯上者，鲜矣……孝弟也者，其为仁之本与！',tr:'孝敬父母友爱兄弟的人很少犯上作乱。孝悌就是仁的根本！',img:'👨‍👩‍👦❤️',tags:['#仁','#孝','#务本'],li:['孔子','曾子','颜回'],cs:[{n:'子路',t:'有子兄说得对。不过我爹走得早……我敬重夫子。'},{n:'曾子',t:'孝悌为仁之本，牢记在心。'}]},
{a:{n:'子夏',e:'📜',bg:'#2980b9'},ti:'1小时前',src:'学而 1.7',o:'贤贤易色；事父母能竭其力；事君能致其身；与朋友交言而有信。虽曰未学，吾必谓之学矣。',tr:'重贤德不重容貌，侍奉父母尽心、事奉君主献身、对朋友讲信用。就算没上过学，我也说他有学问。',img:'🫶💪🤝',tags:['#学','#君子','#做人'],li:['子游','曾子','孔子'],cs:[{n:'子游',t:'子夏兄的标准真高。能做到这四样确实不需要文凭了。'},{n:'孔子',t:'商也，言而有信，不错。'}]},
{a:{n:'曾子',e:'🙏',bg:'#8e44ad'},ti:'2小时前',src:'学而 1.4',o:'吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？',tr:'我每天三次反省自己：替人谋划尽心了吗？和朋友交往守信了吗？老师教的练习了吗？',img:'🔍💭📝',tags:['#自省','#自律','#日常'],li:['孔子','颜回','子夏'],cs:[{n:'子路',t:'每天反省三次也太卷了吧 😳'},{n:'曾子',t:'回复 子路：不卷，就睡前想一遍。'},{n:'孔子',t:'参也鲁，但鲁钝者最扎实。'},{n:'子贡',t:'难怪夫子把道统传给你 👍'}]},

{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'3小时前',src:'为政 2.4',o:'吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩。',tr:'十五岁立志学习，三十岁自立，四十岁不再迷惑，五十岁明白天命，六十岁什么都听得进，七十岁随心所欲不犯规。',img:'🌅🧭🏔️',tags:['#自述','#人生','#成长'],li:['曾子','子夏','子贡','冉有','仲弓','有子'],cs:[{n:'子贡',t:'夫子这是在写人生总结？读完觉得我浪费了三十年 😅'},{n:'子夏',t:'我二十几岁，看到"三十而立"压力好大……'},{n:'孔子',t:'回复 子夏：不急，每个人节奏不同。'},{n:'子路',t:'夫子你确定"耳顺"是夸自己？我怎么觉得你骂人还挺凶的 😂'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'3小时前',src:'为政 2.1',o:'为政以德，譬如北辰，居其所而众星共之。',tr:'用道德来治理国家，就像北极星，安住在自己的位置，群星环绕着它。',img:'⭐🌌✨',tags:['#政','#德','#北辰'],li:['仲弓','子贡','子夏','子张'],cs:[{n:'子张',t:'这句话可以当座右铭刻在朝廷柱子上。'},{n:'子贡',t:'以德服人，不是以力服人——夫子的为政之道。'},{n:'冉有',t:'说实话，当官实际操作中，光讲德不太够……'},{n:'孔子',t:'回复 冉有：政者正也。子帅以正，孰敢不正？'}]},
// ===== 八佾篇 =====
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'4小时前',src:'八佾 3.1',o:'八佾舞于庭，是可忍也，孰不可忍也？',tr:'（季氏）在家里用天子的八佾乐舞，这都能忍，还有什么不能忍？',img:'😤💃🚫',tags:['#礼','#怼人','#季氏'],li:['子路','子贡'],cs:[{n:'子路',t:'夫子怒了！！季氏真是越来越过分 🔥'},{n:'子贡',t:'礼崩乐坏就是从这种小事开始的啊。'},{n:'冉有',t:'……（默默不敢说话）'}]},
// ===== 里仁篇 =====
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'5小时前',src:'里仁 4.8',o:'朝闻道，夕死可矣。',tr:'早上闻知大道，晚上死了也甘心。',img:'🌅✨🕊️',tags:['#道','#金句','#极致'],li:['颜回','曾子','子贡','子夏','仲弓'],cs:[{n:'颜回',t:'😭 每次读到这句都想哭'},{n:'子贡',t:'六个字胜过万言书。'},{n:'子路',t:'夫子你今天怎么这么深沉……'},{n:'曾子',t:'这种境界，才是真正的求道者。'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'5小时前',src:'里仁 4.16',o:'君子喻于义，小人喻于利。',tr:'君子明白的是道义，小人明白的是利益。',img:'⚖️💰❌',tags:['#君子小人','#义','#价值观'],li:['颜回','曾子','子夏'],cs:[{n:'子路',t:'利有时候也挺重要啊夫子……'},{n:'子贡',t:'回复 子路：夫子的意思是出发点不同。君子做事考虑对不对，小人考虑划不划算。'},{n:'孔子',t:'回复 子路：你先问问自己，做一件事是因为该做，还是因为有利可图？'}]},
// ===== 公冶长篇 =====
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'6小时前',src:'公冶长 5.10',o:'朽木不可雕也，粪土之墙不可杇也！于予与何诛？',tr:'烂木头没法雕，粪土墙没法刷！对宰我还能说什么？',img:'😴🪵💢',tags:['#怼人','#宰我','#名言'],li:['子路'],cs:[{n:'子路',t:'哈哈哈哈哈哈哈哈宰我你完了 😂😂😂😂'},{n:'子贡',t:'宰我这是触了夫子哪根筋……'},{n:'宰我',t:'……我就睡了个午觉啊夫子 🥺🥺'},{n:'孔子',t:'回复 宰我：始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。你改变了我看人的方式。'},{n:'颜回',t:'这个故事的教育意义：不要在夫子讲课的时候睡觉 ⚠️'},{n:'子夏',t:'宰我以一己之力改变了夫子的识人方法……某种意义上很厉害 😂'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'6小时前',src:'公冶长 5.3',o:'子谓子贱：君子哉若人！鲁无君子者，斯焉取斯？',tr:'孔子评价子贱：这个人真是君子啊！如果说鲁国没有君子，那子贱的德行是从哪学来的呢？',img:'🕊️👑✨',tags:['#教弟子','#子贱','#君子'],li:['子贱','颜回','子贡','曾子'],cs:[{n:'子贱',t:'夫子过奖了 🙏 我只是跟着夫子学而已'},{n:'子贡',t:'子贱确实低调又厉害。崇拜！'},{n:'子路',t:'我什么时候能被夫子这么夸一次就好了 😔'},{n:'孔子',t:'回复 子路：由也……你先把脾气收一收。'}]},
// ===== 雍也篇 =====
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'8小时前',src:'雍也 6.11',o:'贤哉回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉回也！',tr:'颜回真贤德啊！一碗饭一瓢水住在陋巷，别人受不了这种苦，他却不改快乐。真贤德啊！',img:'🍚🥣🏚️',tags:['#颜回','#安贫乐道','#贤德'],li:['曾子','子贡','仲弓','子夏','子张','有子','子贱','闵子骞'],cs:[{n:'子贡',t:'颜回是真·圣人。我做不到 🫡'},{n:'颜回',t:'夫子过奖了……跟着夫子学习就是我最大的快乐 🙏'},{n:'子路',t:'我饿三天就不行了有没有人管我 😅'},{n:'曾子',t:'"人不堪其忧，回也不改其乐"——这就是境界'},{n:'闵子骞',t:'回兄是我最敬佩的同门。'},{n:'樊迟',t:'请教颜回兄：怎么才能在陋巷还快乐？'},{n:'颜回',t:'回复 樊迟：每天学一点新东西就很快乐。'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'8小时前',src:'雍也 6.3',o:'有颜回者好学，不迁怒，不贰过。不幸短命死矣，今也则亡。',tr:'有个叫颜回的好学，不迁怒于人，不犯同样的错。不幸短命死了，现在再也没有这样的人了。',img:'🕯️🌟💔',tags:['#颜回','#怀念','#不贰过'],li:['曾子','子贡','子夏','仲弓','子张','冉有','有子','闵子骞','司马牛'],cs:[{n:'子贡',t:'😭😭😭 每次读到这段都想哭'},{n:'曾子',t:'颜回兄走了之后，感觉孔门少了最亮的那颗星……'},{n:'子路',t:'虽然我和颜回性格完全不同，但他确实是我最佩服的同门。'},{n:'子夏',t:'"不迁怒，不贰过"——这四个字我贴在床头。'},{n:'司马牛',t:'😢 听到这段话我也想哭。同为失去兄弟的人……'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'8小时前',src:'雍也 6.18',o:'质胜文则野，文胜质则史。文质彬彬，然后君子。',tr:'质朴胜过文采就粗野，文采胜过质朴就虚浮。文采和质朴配合得当才是君子。',img:'✍️🏃🎯',tags:['#君子','#修养','#平衡'],li:['子夏','子贡','曾子'],cs:[{n:'子游',t:'子夏兄的学生有点偏文采了……要不要注意一下？'},{n:'子夏',t:'回复 子游：先打基础再求平衡。'},{n:'孔子',t:'师也过，商也不及。过犹不及。'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'8小时前',src:'雍也 6.20',o:'知之者不如好之者，好之者不如乐之者。',tr:'知道它不如喜欢它，喜欢它不如以它为乐。',img:'🧠❤️🎵',tags:['#学','#境界','#快乐'],li:['颜回','子贡','曾子'],cs:[{n:'颜回',t:'这就是我为什么每天都很快乐 🙏'},{n:'子贡',t:'三层境界：知道→喜欢→享受。我在第二层……'},{n:'曾子',t:'以道为乐，才是最高境界。受教了。'}]},
// ===== 述而篇 =====
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'昨天',src:'述而 7.16',o:'饭疏食饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。',tr:'吃粗粮喝白水，弯着胳膊当枕头，快乐也在其中。不正当地得来的富贵，对我来说就像浮云。',img:'☁️☁️🌤️',tags:['#价值观','#贫富','#浮云'],li:['颜回','曾子','仲弓','原宪'],cs:[{n:'颜回',t:'知音！一箪食一瓢饮 🥣'},{n:'子路',t:'可是夫子你也想做官啊……'},{n:'孔子',t:'回复 子路：做官和贪不义之财是两回事。'},{n:'子贡',t:'夫子的境界我们只能仰望 👑'},{n:'原宪',t:'贫是没钱，学道不践行才是病。我是贫不是病。'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'昨天',src:'述而 7.22',o:'三人行，必有我师焉。择其善者而从之，其不善者而改之。',tr:'三人同行，必有值得我学习的。选好的学，不好的引以为戒。',img:'👥🔍✨',tags:['#学','#谦虚','#成长'],li:['颜回','子贡','曾子','子夏','子游','樊迟'],cs:[{n:'子贡',t:'夫子都认为别人有可学之处，我有什么资格骄傲 😔'},{n:'樊迟',t:'三人行有师！记下了！'},{n:'子路',t:'那如果身边全是烂人呢？'},{n:'孔子',t:'回复 子路：其不善者而改之——看到烂的地方，就反省自己有没有。这就是学到东西了。'}]},
{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'昨天',src:'述而 7.1',o:'述而不作，信而好古，窃比于我老彭。',tr:'传述而不创作，相信并喜爱古代文化，我私下把自己比作老彭。',img:'📖🕰️✨',tags:['#自述','#学术','#传承'],li:['曾子','子夏'],cs:[{n:'子贡',t:'夫子说自己"述而不作"，但您整理了六经啊！这还不是创作？'},{n:'孔子',t:'回复 子贡：我只是整理和传述，内容都是先王之道。'},{n:'子夏',t:'夫子谦虚了。文化的传承就是最大的创作。'}]},
// ===== 泰伯篇 =====
{a:{n:'曾子',e:'🙏',bg:'#8e44ad'},ti:'昨天',src:'泰伯 8.7',o:'士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？',tr:'读书人不能不心胸宽广意志坚定，责任重道路远。把仁作为自己的责任，死后才罢休。',img:'💪🛤️🌄',tags:['#君子','#责任','#弘毅'],li:['孔子','颜回','子夏','子张','樊迟'],cs:[{n:'子贡',t:'曾子兄今天精神状态满分！这段话气吞山河 💪'},{n:'子路',t:'"仁以为己任"——我可能做不到，但我想试试 🫡'},{n:'孔子',t:'参也，说到做到。我很放心。'},{n:'樊迟',t:'任重道远四个字我要刻在竹简上。'}]},

{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'2天前',src:'子罕 9.28',o:'岁寒，然后知松柏之后凋也。',tr:'天冷了，才知道松柏是最后凋零的。',img:'🌲❄️💪',tags:['#君子','#坚毅','#考验'],li:['颜回','曾子','子路','子贡','仲弓','子张'],cs:[{n:'子路',t:'这是说我是松柏！我耐冻！！💪'},{n:'子贡',t:'回复 子路：夫子是在说品德，不是说身体……'},{n:'曾子',t:'到什么环境最能看出一个人的品格。'},{n:'子张',t:'岁寒知松柏，日久见人心。'}]},

{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'2天前',src:'先进 11.12',o:'季路问事鬼神。子曰：未能事人，焉能事鬼？敢问死。曰：未知生，焉知死？',tr:'子路问怎么事奉鬼神。孔子说：人还没事奉好，怎么事奉鬼神？子路又问死是怎么回事。孔子说：还没弄明白生，怎么知道死？',img:'👻❓🌱',tags:['#天命','#生死','#子路'],li:['颜回','曾子','子贡'],cs:[{n:'子路',t:'我就好奇问一下嘛……'},{n:'子贡',t:'夫子的意思是先活好这一生。务实。'},{n:'曾子',t:'未知生焉知死——六字真言。'}]},
{a:{n:'子贡',e:'💰',bg:'#16a085'},ti:'2天前',src:'先进 11.19',o:'赐不受命而货殖焉，亿则屡中。',tr:'子贡不安于天命去做生意，猜测行情却屡屡猜中。',img:'📈💰🎯',tags:['#自述','#经商','#天赋'],li:['子路','冉有'],cs:[{n:'子路',t:'子贡你就是在凡尔赛！"亿则屡中"=我随便猜都中了！'},{n:'子贡',t:'回复 子路：我这是实话啊……'},{n:'冉有',t:'子贡兄的商业头脑确实天赋异禀。'}]},
{a:{n:'子路',e:'⚔️',bg:'#c0392b'},ti:'2天前',src:'先进 11.26',o:'子路率尔而对曰：千乘之国，摄乎大国之间……由也为之，比及三年，可使有勇且知方也。夫子哂之。',tr:'子路抢先说：千乘之国夹在大国之间，让我治理三年，就能让百姓勇敢并且明白道义。孔子笑了笑。',img:'🛡️🏰😏',tags:['#自述','#志向','#子路本色'],li:['冉有','公西华','曾皙'],cs:[{n:'曾皙',t:'子路兄第一个抢着说，夫子却笑了……'},{n:'孔子',t:'为国以礼，其言不让，是故哂之。'},{n:'子路',t:'回复 孔子：我说的是实话啊夫子 😤'}]},

{a:{n:'孔子',e:'👑',bg:'#8B4513'},ti:'3天前',src:'颜渊 12.1',o:'克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？',tr:'约束自己回归礼，就是仁。一旦做到，天下就归于仁了。行仁靠自己，难道靠别人吗？',img:'🔒➡️❤️',tags:['#仁','#礼','#核心'],li:['颜回','曾子','子贡','仲弓','有子'],cs:[{n:'颜回',t:'回虽不敏，请事斯语矣 🙏——夫子这句话我永生奉行'},{n:'子贡',t:'"为仁由己"四个字重点划线！仁是自发的，不是别人逼的。'},{n:'仲弓',t:'下一篇夫子也跟我讲了仁——内容不同但核心一致。'}]},

{a:{n:'子游',e:'🎵',bg:'#006064'},ti:'1周前',src:'阳货 17.4',o:'子游为武城宰。子之武城，闻弦歌之声。夫子莞尔而笑曰：割鸡焉用牛刀？',tr:'子游做武城长官。孔子到武城听到处处弦歌之声，微笑着说杀鸡何必用牛刀呢？',img:'🏙️🎵🎻',tags:['#政','#礼乐','#子游'],li:['孔子','子夏','曾子'],cs:[{n:'子夏',t:'子游兄用礼乐治理一个小城，格局大 🎵'},{n:'子游',t:'回复 子夏：君子学道则爱人，小人学道则易使——夫子教我的。'},{n:'孔子',t:'二三子，偃之言是也。前言戏之耳。——弟子们，子游说得对，我刚才是开玩笑的。'},{n:'子路',t:'夫子还会开玩笑！🤣'}]},

const tags=['全部','#仁','#礼','#学','#政','#怼人','#颜回','#子路','#君子'];

function buildFilters(){
  document.getElementById('filterBar').innerHTML=tags.map((t,i)=>`<button data-tag="${t}" class="${i===0?'f-active':''}" onclick="filter('${t}',this)">${t}</button>`).join('');
}

function filter(tag,btn){
  document.querySelectorAll('#filterBar button').forEach(b=>b.classList.remove('f-active'));
  btn.classList.add('f-active');
  const ms=document.querySelectorAll('.moment');
  let count=0;
  ms.forEach((m,i)=>{
    const show=tag==='全部'||moments[i].tags.join(' ').includes(tag);
    m.classList.toggle('hidden',!show);
    if(show)count++;
  });
}

function renderFeed(){
  document.getElementById('feed').innerHTML=moments.map((m,i)=>`
    <div class="moment" style="animation-delay:${i*0.08}s">
      <div class="moment-header">
        <div class="moment-avatar" style="background:${m.a.bg}">${m.a.e}</div>
        <div><div class="moment-name">${m.a.n}</div><div class="moment-time">${m.ti}</div></div>
      </div>
      <div class="moment-content">
        <div class="src">📖 ${m.src}</div>
        <div class="original">${m.o}</div>
        <div class="trans">${m.tr}</div>
      </div>
      <div class="moment-image">${m.img}</div>
      <div class="moment-tags">${m.tags.map(t=>`<span class="moment-tag">${t}</span>`).join('')}</div>
      <div class="moment-interactions">
        <div class="likes">❤️ ${m.li.join('、')} 等${m.li.length}人赞了</div>
        ${m.cs.map(c=>`<div class="comment${c.n===m.a.n?'':' reply'}"><span class="cmt-name">${c.n}：</span>${c.t}</div>`).join('')}
      </div>
    </div>
  `).join('');
}
