<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 产出曲线 -->
  <g opacity="0.7">
    <!-- 坐标轴 -->
    <line x1="80" y1="220" x2="350" y2="220" stroke="#5d6b85" stroke-width="0.5" opacity="0.3"/>
    <line x1="80" y1="220" x2="80" y2="60" stroke="#5d6b85" stroke-width="0.5" opacity="0.3"/>
    <!-- 曲线 -->
    <path d="M 80 210 L 120 205 L 160 195 L 200 170 L 240 130 L 280 90 L 320 75 L 350 70" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7"/>
    <!-- 填充 -->
    <path d="M 80 210 L 120 205 L 160 195 L 200 170 L 240 130 L 280 90 L 320 75 L 350 70 L 350 220 L 80 220 Z" fill="url(#accent)" opacity="0.08"/>
    <!-- 数据点 -->
    <circle cx="80" cy="210" r="3" fill="#06b6d4" opacity="0.6"/>
    <circle cx="160" cy="195" r="3" fill="#06b6d4" opacity="0.6"/>
    <circle cx="240" cy="130" r="3" fill="#6366f1" opacity="0.7"/>
    <circle cx="320" cy="75" r="4" fill="url(#warm)" opacity="0.8"/>
  </g>
  <!-- 里程碑 -->
  <text x="320" y="60" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="9" opacity="0.5">148K</text>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="15" font-weight="bold">创作产出曲线 · 2026</text>
</svg>
