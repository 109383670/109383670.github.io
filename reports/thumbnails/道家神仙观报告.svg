<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 仙山 -->
  <path d="M 80 180 L 130 100 L 160 130 L 200 80 L 250 120 L 280 95 L 320 180 Z" fill="url(#cyan)" opacity="0.15" stroke="url(#cyan)" stroke-width="1.5" opacity="0.6"/>
  <!-- 云 -->
  <ellipse cx="120" cy="160" rx="35" ry="8" fill="#06b6d4" opacity="0.15"/>
  <ellipse cx="260" cy="150" rx="40" ry="9" fill="#0ea5e9" opacity="0.12"/>
  <ellipse cx="200" cy="175" rx="50" ry="10" fill="#06b6d4" opacity="0.1"/>
  <!-- 鹤 -->
  <path d="M 310 110 Q 315 105 320 108 L 325 112 Q 330 108 335 112" stroke="#e6edf7" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- 丹药/仙丹 -->
  <circle cx="200" cy="80" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="200" cy="80" r="10" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>
  <!-- 仙人轮廓 -->
  <g opacity="0.3" transform="translate(200, 135)">
    <circle cx="0" cy="-10" r="6" fill="none" stroke="#e6edf7" stroke-width="1"/>
    <path d="M -8 0 L 8 0 L 12 20 L -12 20 Z" fill="none" stroke="#e6edf7" stroke-width="1"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="17" font-weight="bold">道家神仙观报告</text>
</svg>
