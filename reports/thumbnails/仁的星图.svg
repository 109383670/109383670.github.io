<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 仁字星图中心 -->
  <text x="200" y="130" text-anchor="middle" fill="url(#accent)" font-family="serif" font-size="42" font-weight="bold" opacity="0.8">仁</text>
  <!-- 环绕的德目 -->
  <g opacity="0.45" fill="#fbbf24" font-family="serif" font-size="12">
    <text x="200" y="72" text-anchor="middle">义</text>
    <text x="260" y="82" text-anchor="middle">礼</text>
    <text x="305" y="115" text-anchor="middle">智</text>
    <text x="320" y="160" text-anchor="middle">信</text>
    <text x="295" y="200" text-anchor="middle">忠</text>
    <text x="250" y="225" text-anchor="middle">恕</text>
    <text x="195" y="240" text-anchor="middle">孝</text>
    <text x="135" y="225" text-anchor="middle">悌</text>
    <text x="90" y="200" text-anchor="middle">勇</text>
    <text x="80" y="160" text-anchor="middle">恭</text>
    <text x="90" y="115" text-anchor="middle">宽</text>
    <text x="135" y="82" text-anchor="middle">敏</text>
  </g>
  <!-- 星轨 -->
  <circle cx="200" cy="128" r="55" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="128" r="80" fill="none" stroke="#f59e0b" stroke-width="0.4" opacity="0.1"/>
  <circle cx="200" cy="128" r="100" fill="none" stroke="#f59e0b" stroke-width="0.3" opacity="0.08"/>
  <!-- 散星 -->
  <g opacity="0.3">
    <circle cx="60" cy="60" r="1" fill="#fbbf24"/>
    <circle cx="340" cy="50" r="1" fill="#fbbf24"/>
    <circle cx="50" cy="220" r="1" fill="#fbbf24"/>
    <circle cx="360" cy="230" r="1" fill="#fbbf24"/>
    <circle cx="370" cy="80" r="1" fill="#fbbf24"/>
    <circle cx="30" cy="150" r="1" fill="#fbbf24"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="15" font-weight="bold">仁的星图 · 儒家道德体系</text>
</svg>
