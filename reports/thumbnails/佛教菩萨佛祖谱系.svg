<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 莲花 -->
  <g transform="translate(200, 130)">
    <path d="M 0 -40 Q -15 -20 -20 0 Q -10 -10 0 -15 Q 10 -10 20 0 Q 15 -20 0 -40" fill="url(#gold)" opacity="0.6"/>
    <path d="M -30 -10 Q -25 -30 -10 -35 Q -15 -15 -20 -5 Q -28 -8 -30 -10" fill="url(#gold)" opacity="0.5"/>
    <path d="M 30 -10 Q 25 -30 10 -35 Q 15 -15 20 -5 Q 28 -8 30 -10" fill="url(#gold)" opacity="0.5"/>
    <path d="M -35 5 Q -30 -15 -20 -25 Q -25 -5 -30 10 Q -35 8 -35 5" fill="url(#gold)" opacity="0.4"/>
    <path d="M 35 5 Q 30 -15 20 -25 Q 25 -5 30 10 Q 35 8 35 5" fill="url(#gold)" opacity="0.4"/>
    <circle cx="0" cy="-10" r="6" fill="#fbbf24" opacity="0.8"/>
  </g>
  <!-- 光环 -->
  <circle cx="200" cy="125" r="55" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <ellipse cx="200" cy="180" rx="40" ry="6" fill="url(#halo)" opacity="0.5"/>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="15" font-weight="bold">佛教菩萨佛祖谱系</text>
</svg>
