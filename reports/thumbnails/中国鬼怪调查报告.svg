<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 冥界之门 -->
  <path d="M 160 220 Q 160 120 200 100 Q 240 120 240 220" fill="none" stroke="url(#mist)" stroke-width="2" opacity="0.6"/>
  <!-- 鬼火 -->
  <circle cx="180" cy="160" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="180" cy="160" r="8" fill="#a855f7" opacity="0.2"/>
  <circle cx="220" cy="155" r="3" fill="#06b6d4" opacity="0.5"/>
  <circle cx="220" cy="155" r="7" fill="#06b6d4" opacity="0.15"/>
  <circle cx="200" cy="130" r="2" fill="#6366f1" opacity="0.4"/>
  <!-- 雾气 -->
  <ellipse cx="120" cy="180" rx="50" ry="12" fill="url(#mist)" opacity="0.15"/>
  <ellipse cx="280" cy="170" rx="55" ry="14" fill="url(#mist)" opacity="0.12"/>
  <ellipse cx="200" cy="200" rx="70" ry="10" fill="url(#mist)" opacity="0.1"/>
  <!-- 蒲扇/招魂幡 -->
  <line x1="200" y1="220" x2="200" y2="100" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
  <text x="200" y="270" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="16" font-weight="bold">中国鬼怪调查报告</text>
</svg>
