<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#e2c485"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 朋友圈节点网络 -->
  <!-- 中心孔子 -->
  <circle cx="200" cy="125" r="10" fill="url(#gold)" opacity="0.7"/>
  <text x="200" y="112" text-anchor="middle" fill="#e2c485" font-family="serif" font-size="11" opacity="0.7">孔子</text>
  <!-- 弟子节点 -->
  <g opacity="0.45">
    <circle cx="200" cy="65" r="5" fill="#c8a96e"/>
    <circle cx="270" cy="85" r="5" fill="#c8a96e"/>
    <circle cx="305" cy="140" r="5" fill="#c8a96e"/>
    <circle cx="290" cy="200" r="5" fill="#c8a96e"/>
    <circle cx="230" cy="230" r="5" fill="#c8a96e"/>
    <circle cx="170" cy="235" r="5" fill="#c8a96e"/>
    <circle cx="110" cy="210" r="5" fill="#c8a96e"/>
    <circle cx="85" cy="155" r="5" fill="#c8a96e"/>
    <circle cx="100" cy="95" r="5" fill="#c8a96e"/>
    <circle cx="150" cy="70" r="5" fill="#c8a96e"/>
  </g>
  <!-- 弟子小节点 -->
  <g opacity="0.25">
    <circle cx="170" cy="50" r="3" fill="#c8a96e"/>
    <circle cx="250" cy="60" r="3" fill="#c8a96e"/>
    <circle cx="310" cy="110" r="3" fill="#c8a96e"/>
    <circle cx="320" cy="175" r="3" fill="#c8a96e"/>
    <circle cx="260" cy="245" r="3" fill="#c8a96e"/>
    <circle cx="200" cy="250" r="3" fill="#c8a96e"/>
    <circle cx="140" cy="245" r="3" fill="#c8a96e"/>
    <circle cx="80" cy="190" r="3" fill="#c8a96e"/>
    <circle cx="70" cy="120" r="3" fill="#c8a96e"/>
    <circle cx="100" cy="75" r="3" fill="#c8a96e"/>
  </g>
  <!-- 连线 -->
  <g opacity="0.12" stroke="#c8a96e" stroke-width="0.8">
    <line x1="200" y1="125" x2="200" y2="65"/>
    <line x1="200" y1="125" x2="270" y2="85"/>
    <line x1="200" y1="125" x2="305" y2="140"/>
    <line x1="200" y1="125" x2="290" y2="200"/>
    <line x1="200" y1="125" x2="230" y2="230"/>
    <line x1="200" y1="125" x2="170" y2="235"/>
    <line x1="200" y1="125" x2="110" y2="210"/>
    <line x1="200" y1="125" x2="85" y2="155"/>
    <line x1="200" y1="125" x2="100" y2="95"/>
    <line x1="200" y1="125" x2="150" y2="70"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="15" font-weight="bold">孔门朋友圈</text>
</svg>
