<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>
    <linearGradient id="god" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 天宫 -->
  <g opacity="0.6">
    <!-- 宫殿轮廓 -->
    <path d="M 130 180 L 130 120 L 200 90 L 270 120 L 270 180" fill="none" stroke="url(#god)" stroke-width="1.5" opacity="0.5"/>
    <path d="M 150 180 L 150 130 L 200 110 L 250 130 L 250 180" fill="none" stroke="url(#god)" stroke-width="1" opacity="0.4"/>
    <!-- 屋顶 -->
    <path d="M 120 120 L 200 85 L 280 120 L 270 120 L 200 90 L 130 120 Z" fill="url(#god)" opacity="0.2"/>
  </g>
  <!-- 星神散布 -->
  <circle cx="100" cy="80" r="3" fill="url(#star)" opacity="0.6"/>
  <circle cx="320" cy="75" r="3" fill="url(#star)" opacity="0.5"/>
  <circle cx="80" cy="130" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="330" cy="140" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="200" cy="60" r="2.5" fill="url(#star)" opacity="0.5"/>
  <!-- 大战裂痕 -->
  <path d="M 160 200 L 170 210 L 165 220 L 175 230" stroke="#dc2626" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 240 200 L 230 215 L 235 225 L 225 235" stroke="#dc2626" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="200" y="270" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="15" font-weight="bold">天宫大战神谱全图</text>
</svg>
