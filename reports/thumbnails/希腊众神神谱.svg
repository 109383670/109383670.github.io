<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e6edf7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 橄榄枝花环 -->
  <ellipse cx="200" cy="125" rx="75" ry="70" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.7"/>
  <!-- 橄榄叶 -->
  <g opacity="0.6">
    <ellipse cx="140" cy="80" rx="8" ry="3" fill="#f59e0b" transform="rotate(-30 140 80)"/>
    <ellipse cx="260" cy="80" rx="8" ry="3" fill="#f59e0b" transform="rotate(30 260 80)"/>
    <ellipse cx="125" cy="125" rx="8" ry="3" fill="#fbbf24" transform="rotate(-60 125 125)"/>
    <ellipse cx="275" cy="125" rx="8" ry="3" fill="#fbbf24" transform="rotate(60 275 125)"/>
    <ellipse cx="140" cy="170" rx="8" ry="3" fill="#f59e0b" transform="rotate(-120 140 170)"/>
    <ellipse cx="260" cy="170" rx="8" ry="3" fill="#f59e0b" transform="rotate(120 260 170)"/>
    <ellipse cx="170" cy="60" rx="7" ry="3" fill="#fbbf24" transform="rotate(-15 170 60)"/>
    <ellipse cx="230" cy="60" rx="7" ry="3" fill="#fbbf24" transform="rotate(15 230 60)"/>
  </g>
  <!-- 闪电 (宙斯) -->
  <path d="M 195 95 L 210 120 L 198 122 L 215 155 L 200 153 L 212 185" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- 标题 -->
  <text x="200" y="275" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="17" font-weight="bold">希腊众神神谱</text>
</svg>
