<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 三大批判三角 -->
  <g transform="translate(200, 135)">
    <polygon points="0,-60 -65,35 65,35" fill="none" stroke="url(#indigo)" stroke-width="1.5" opacity="0.5"/>
    <!-- 顶点 -->
    <circle cx="0" cy="-60" r="18" fill="url(#indigo)" opacity="0.3" stroke="url(#indigo)" stroke-width="1"/>
    <text x="0" y="-55" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="10">纯粹</text>
    <!-- 左点 -->
    <circle cx="-65" cy="35" r="18" fill="url(#cyan)" opacity="0.3" stroke="url(#cyan)" stroke-width="1"/>
    <text x="-65" y="40" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="10">实践</text>
    <!-- 右点 -->
    <circle cx="65" cy="35" r="18" fill="url(#indigo)" opacity="0.3" stroke="url(#indigo)" stroke-width="1"/>
    <text x="65" y="40" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="10">判断</text>
    <!-- 中心 -->
    <circle cx="0" cy="0" r="5" fill="#a855f7" opacity="0.6"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="17" font-weight="bold">康德研究 · 知识图谱</text>
</svg>
