<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 云海 -->
  <ellipse cx="120" cy="180" rx="50" ry="10" fill="#0e7490" opacity="0.15"/>
  <ellipse cx="290" cy="190" rx="40" ry="8" fill="#0e7490" opacity="0.12"/>
  <!-- 仙山 -->
  <g transform="translate(200, 130)" opacity="0.8">
    <path d="M -70 45 L -25 -15 Q -10 -30 0 -25 L 25 -10 Q 30 -5 70 45 Z" fill="none" stroke="url(--cyan)" stroke-width="1.2" opacity="0.4"/>
    <path d="M -60 45 L -20 -5 L 40 45 Z" fill="none" stroke="url(--cyan)" stroke-width="0.8" opacity="0.25"/>
    <!-- 山顶光 -->
    <circle cx="0" cy="-20" r="10" fill="#67e8f9" opacity="0.15"/>
  </g>
  <!-- 飞剑 -->
  <g transform="translate(300, 90) rotate(30)" opacity="0.6">
    <path d="M -30 0 L 25 0 L 30 3 L 25 6 L -30 6 Z" fill="url(#gold)" opacity="0.5"/>
    <path d="M 25 0 L 38 -4 L 35 3 L 38 10 L 25 6 Z" fill="#e2c485" opacity="0.5"/>
    <path d="M -30 0 L -38 -2 L -35 3 L -38 8 L -30 6 Z" fill="#e2c485" opacity="0.3"/>
    <!-- 剑气 -->
    <path d="M -38 3 L -70 3" stroke="#e2c485" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- 丹炉 -->
  <g transform="translate(90, 210)" opacity="0.4">
    <rect x="-12" y="-15" width="24" height="20" rx="3" fill="none" stroke="#c8a96e" stroke-width="1"/>
    <path d="M -15 5 L 15 5 L 12 15 L -12 15 Z" fill="none" stroke="#c8a96e" stroke-width="1"/>
    <circle cx="0" cy="-18" r="4" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
  </g>
  <!-- 星星 -->
  <g opacity="0.3">
    <circle cx="60" cy="60" r="1" fill="#67e8f9"/>
    <circle cx="330" cy="50" r="1" fill="#67e8f9"/>
    <circle cx="370" cy="160" r="1" fill="#67e8f9"/>
    <circle cx="40" cy="140" r="1" fill="#67e8f9"/>
  </g>
  <text x="200" y="272" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="15" font-weight="bold">修仙 · 创作设定参考</text>
</svg>
