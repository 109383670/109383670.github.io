<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#080f1a"/>
    </linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="slow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 系统1 快 -->
  <circle cx="140" cy="120" r="45" fill="none" stroke="url(#fast)" stroke-width="2" opacity="0.5"/>
  <circle cx="140" cy="120" r="45" fill="url(#fast)" opacity="0.06"/>
  <text x="140" y="115" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="22" font-weight="bold" opacity="0.7">1</text>
  <text x="140" y="140" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="9" opacity="0.5">快 · 直觉</text>
  <!-- 系统2 慢 -->
  <circle cx="260" cy="120" r="45" fill="none" stroke="url(#slow)" stroke-width="2" opacity="0.5"/>
  <circle cx="260" cy="120" r="45" fill="url(#slow)" opacity="0.06"/>
  <text x="260" y="115" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="22" font-weight="bold" opacity="0.7">2</text>
  <text x="260" y="140" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="9" opacity="0.5">慢 · 理性</text>
  <!-- 连接 -->
  <line x1="185" y1="120" x2="215" y2="120" stroke="url(#fast)" stroke-width="1" opacity="0.3" stroke-dasharray="4 2"/>
  <line x1="215" y1="120" x2="185" y2="120" stroke="url(#slow)" stroke-width="1" opacity="0.3" stroke-dasharray="4 2"/>
  <!-- 大脑 -->
  <g opacity="0.2" transform="translate(200, 195)">
    <path d="M -30 0 Q -30 -15 -15 -18 Q 0 -22 15 -18 Q 30 -15 30 0 Q 30 15 15 18 Q 0 20 -15 18 Q -30 15 -30 0 Z" fill="none" stroke="url(#slow)" stroke-width="1"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="16" font-weight="bold">思考，快与慢</text>
</svg>
