<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 八十一首方阵 9x9 -->
  <g opacity="0.8">
    <rect x="110" y="50" width="180" height="180" fill="none" stroke="url(#purple)" stroke-width="1" opacity="0.3"/>
    <g stroke="url(#purple)" stroke-width="0.5" opacity="0.25">
      <line x1="110" y1="70" x2="290" y2="70"/><line x1="110" y1="90" x2="290" y2="90"/>
      <line x1="110" y1="110" x2="290" y2="110"/><line x1="110" y1="130" x2="290" y2="130"/>
      <line x1="110" y1="150" x2="290" y2="150"/><line x1="110" y1="170" x2="290" y2="170"/>
      <line x1="110" y1="190" x2="290" y2="190"/><line x1="110" y1="210" x2="290" y2="210"/>
      <line x1="130" y1="50" x2="130" y2="230"/><line x1="150" y1="50" x2="150" y2="230"/>
      <line x1="170" y1="50" x2="170" y2="230"/><line x1="190" y1="50" x2="190" y2="230"/>
      <line x1="210" y1="50" x2="210" y2="230"/><line x1="230" y1="50" x2="230" y2="230"/>
      <line x1="250" y1="50" x2="250" y2="230"/><line x1="270" y1="50" x2="270" y2="230"/>
    </g>
  </g>
  <!-- 中心玄 -->
  <text x="200" y="155" text-anchor="middle" fill="url(#purple)" font-family="serif" font-size="36" font-weight="bold" opacity="0.9">玄</text>
  <!-- 三才线 -->
  <line x1="200" y1="50" x2="200" y2="230" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <line x1="110" y1="140" x2="290" y2="140" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="270" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="16" font-weight="bold">太玄经象征研究</text>
</svg>
