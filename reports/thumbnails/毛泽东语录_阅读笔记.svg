<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 五角星 -->
  <g transform="translate(200, 120)" opacity="0.7">
    <polygon points="0,-30 8,-10 28,-10 12,3 18,22 0,10 -18,22 -12,3 -28,-10 -8,-10" fill="url(#star)" opacity="0.5" stroke="url(#red)" stroke-width="1"/>
  </g>
  <!-- 红旗飘扬 -->
  <path d="M 130 165 Q 160 155 200 160 Q 240 165 270 155 L 270 185 Q 240 195 200 190 Q 160 185 130 195 Z" fill="url(#red)" opacity="0.3"/>
  <!-- 书 -->
  <g transform="translate(200, 170)">
    <rect x="-45" y="0" width="90" height="30" rx="2" fill="#111827" stroke="url(#red)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="url(#red)" stroke-width="0.5" opacity="0.4"/>
    <line x1="-35" y1="10" x2="-10" y2="10" stroke="#dc2626" stroke-width="0.5" opacity="0.3"/>
    <line x1="-35" y1="18" x2="-15" y2="18" stroke="#dc2626" stroke-width="0.5" opacity="0.3"/>
    <line x1="10" y1="10" x2="35" y2="10" stroke="#dc2626" stroke-width="0.5" opacity="0.3"/>
    <line x1="10" y1="18" x2="30" y2="18" stroke="#dc2626" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- 实事求是印章 -->
  <rect x="165" y="218" width="70" height="22" rx="2" fill="none" stroke="url(#red)" stroke-width="1.5" opacity="0.5"/>
  <text x="200" y="234" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="11" opacity="0.6">实事求是</text>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="16" font-weight="bold">毛泽东语录 · 阅读笔记</text>
</svg>
