<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 科举阶梯 -->
  <g opacity="0.6">
    <rect x="160" y="200" width="80" height="15" rx="2" fill="url(#gold)" opacity="0.4"/>
    <rect x="165" y="180" width="70" height="15" rx="2" fill="url(#gold)" opacity="0.5"/>
    <rect x="170" y="160" width="60" height="15" rx="2" fill="url(#gold)" opacity="0.6"/>
    <rect x="175" y="140" width="50" height="15" rx="2" fill="url(#gold)" opacity="0.7"/>
    <rect x="180" y="120" width="40" height="15" rx="2" fill="url(#gold)" opacity="0.8"/>
    <rect x="185" y="100" width="30" height="15" rx="2" fill="url(#gold)" opacity="0.9"/>
  </g>
  <!-- 金榜 -->
  <rect x="175" y="75" width="50" height="20" rx="2" fill="url(#red)" opacity="0.5" stroke="url(#gold)" stroke-width="1"/>
  <text x="200" y="90" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="10" opacity="0.8">金榜</text>
  <!-- 功名帽 -->
  <g opacity="0.4" transform="translate(200, 55)">
    <ellipse cx="0" cy="0" rx="20" ry="6" fill="url(#gold)"/>
    <rect x="-8" y="-12" width="16" height="12" rx="2" fill="url(#gold)"/>
  </g>
  <!-- 两侧灯笼 -->
  <circle cx="120" cy="120" r="10" fill="url(#red)" opacity="0.3"/>
  <circle cx="280" cy="120" r="10" fill="url(#red)" opacity="0.3"/>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="15" font-weight="bold">古代科举制度 · 可视化</text>
</svg>
