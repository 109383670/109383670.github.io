<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 海平面 -->
  <rect x="0" y="170" width="400" height="60" fill="url(#sea)"/>
  <line x1="0" y1="170" x2="400" y2="170" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
  <!-- 落日 -->
  <circle cx="200" cy="155" r="25" fill="url(#sun)" opacity="0.5"/>
  <circle cx="200" cy="155" r="35" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <!-- 小船 -->
  <g transform="translate(200, 165)" opacity="0.5">
    <path d="M -20 0 L 20 0 L 15 8 L -15 8 Z" fill="#06b6d4" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <path d="M 0 -25 L 10 -15 L 0 -15 Z" fill="#06b6d4" opacity="0.25"/>
  </g>
  <!-- 时间轴 -->
  <line x1="80" y1="230" x2="320" y2="230" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
  <g opacity="0.4">
    <circle cx="100" cy="230" r="3" fill="#06b6d4"/>
    <circle cx="170" cy="230" r="3" fill="#06b6d4"/>
    <circle cx="240" cy="230" r="3" fill="#06b6d4"/>
    <circle cx="310" cy="230" r="3" fill="#f59e0b"/>
  </g>
  <text x="100" y="248" text-anchor="middle" fill="#5d6b85" font-family="sans-serif" font-size="8" opacity="0.5">Day 1</text>
  <text x="170" y="248" text-anchor="middle" fill="#5d6b85" font-family="sans-serif" font-size="8" opacity="0.5">Day 2</text>
  <text x="240" y="248" text-anchor="middle" fill="#5d6b85" font-family="sans-serif" font-size="8" opacity="0.5">Day 3</text>
  <text x="310" y="248" text-anchor="middle" fill="#5d6b85" font-family="sans-serif" font-size="8" opacity="0.5">Day 5</text>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="15" font-weight="bold">老人与海 · 时间轴</text>
</svg>
