<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f14"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 楼阁 -->
  <g transform="translate(200, 140)" opacity="0.7">
    <!-- 楼体 -->
    <rect x="-55" y="20" width="110" height="55" fill="none" stroke="url(--red)" stroke-width="1.2" opacity="0.5"/>
    <!-- 上层 -->
    <rect x="-42" y="-10" width="84" height="32" fill="none" stroke="url(--red)" stroke-width="1" opacity="0.4"/>
    <!-- 飞檐 -->
    <path d="M -55 20 Q -75 10 -82 22 L -55 28" fill="none" stroke="url(--gold)" stroke-width="1" opacity="0.5"/>
    <path d="M 55 20 Q 75 10 82 22 L 55 28" fill="none" stroke="url(--gold)" stroke-width="1" opacity="0.5"/>
    <path d="M -42 -10 Q -60 -18 -66 -8 L -42 -4" fill="none" stroke="url(--gold)" stroke-width="1" opacity="0.5"/>
    <path d="M 42 -10 Q 60 -18 66 -8 L 42 -4" fill="none" stroke="url(--gold)" stroke-width="1" opacity="0.5"/>
    <!-- 屋顶 -->
    <path d="M -30 -10 Q 0 -32 30 -10" fill="none" stroke="url(--gold)" stroke-width="1.2" opacity="0.5"/>
    <!-- 窗 -->
    <circle cx="-20" cy="35" r="6" fill="none" stroke="url(--gold)" stroke-width="0.6" opacity="0.4"/>
    <circle cx="20" cy="35" r="6" fill="none" stroke="url(--gold)" stroke-width="0.6" opacity="0.4"/>
  </g>
  <!-- 灯笼 -->
  <g transform="translate(95, 190)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="9" ry="12" fill="none" stroke="#e11d48" stroke-width="1"/>
    <line x1="0" y1="-12" x2="0" y2="-16" stroke="#c8a96e" stroke-width="0.8"/>
    <line x1="0" y1="12" x2="0" y2="15" stroke="#c8a96e" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#e11d48" opacity="0.6"/>
  </g>
  <g transform="translate(305, 185)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="9" ry="12" fill="none" stroke="#e11d48" stroke-width="1"/>
    <line x1="0" y1="-12" x2="0" y2="-16" stroke="#c8a96e" stroke-width="0.8"/>
    <line x1="0" y1="12" x2="0" y2="15" stroke="#c8a96e" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#e11d48" opacity="0.6"/>
  </g>
  <!-- 琵琶 -->
  <g transform="translate(300, 225) rotate(-15)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="7" ry="16" fill="none" stroke="#c8a96e" stroke-width="0.8"/>
    <line x1="0" y1="-16" x2="0" y2="-24" stroke="#c8a96e" stroke-width="0.6"/>
  </g>
  <!-- 月亮 -->
  <circle cx="300" cy="80" r="20" fill="#fbbf24" opacity="0.15"/>
  <circle cx="300" cy="80" r="26" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.15"/>
  <text x="200" y="272" text-anchor="middle" fill="#fda4af" font-family="serif" font-size="15" font-weight="bold">中国古代青楼文化</text>
</svg>
