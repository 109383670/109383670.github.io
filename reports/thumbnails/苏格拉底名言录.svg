<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 半身像 -->
  <g transform="translate(200, 110)" opacity="0.65">
    <!-- 头 -->
    <ellipse cx="0" cy="-30" rx="20" ry="26" fill="none" stroke="url(--marble)" stroke-width="1.2"/>
    <!-- 胡子 -->
    <path d="M -14 -10 Q 0 4 14 -10 Q 0 -2 -14 -10 Z" fill="none" stroke="url(--marble)" stroke-width="0.8" opacity="0.5"/>
    <!-- 鼻 -->
    <path d="M -2 -38 L 2 -38 L 2 -20 L -2 -20 Z" fill="none" stroke="url(--marble)" stroke-width="0.6" opacity="0.5"/>
    <!-- 身体 -->
    <path d="M -26 10 L 26 10 L 20 42 L -20 42 Z" fill="none" stroke="url(--marble)" stroke-width="1"/>
    <!-- 披布 -->
    <path d="M -26 10 Q -34 26 -30 42 M 26 10 Q 34 26 30 42" fill="none" stroke="url(--marble)" stroke-width="0.6" opacity="0.5"/>
    <!-- 眼睛 -->
    <circle cx="-8" cy="-32" r="1.5" fill="#94a3b8"/>
    <circle cx="8" cy="-32" r="1.5" fill="#94a3b8"/>
  </g>
  <!-- 月桂枝叶（苏格拉底） -->
  <g transform="translate(200, 190)" opacity="0.4">
    <path d="M -35 0 Q -20 -8 -5 -4 M -5 -4 Q -25 2 -35 0" fill="none" stroke="url(--gold)" stroke-width="0.8"/>
    <path d="M 35 0 Q 20 -8 5 -4 M 5 -4 Q 25 2 35 0" fill="none" stroke="url(--gold)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="2" fill="url(--gold)"/>
  </g>
  <!-- 对话引号 -->
  <g transform="translate(100, 80)" opacity="0.3">
    <text x="0" y="0" fill="#c8a96e" font-family="serif" font-size="30">「</text>
  </g>
  <g transform="translate(290, 80)" opacity="0.3">
    <text x="0" y="0" fill="#c8a96e" font-family="serif" font-size="30">」</text>
  </g>
  <text x="200" y="272" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="15" font-weight="bold">苏格拉底名言合集</text>
</svg>
