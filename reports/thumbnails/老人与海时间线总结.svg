<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 海明威简洁风格——一条线 -->
  <line x1="80" y1="180" x2="320" y2="180" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <!-- 时间节点 -->
  <g opacity="0.6">
    <circle cx="100" cy="180" r="4" fill="#06b6d4" opacity="0.7"/>
    <circle cx="160" cy="180" r="4" fill="#06b6d4" opacity="0.6"/>
    <circle cx="220" cy="180" r="4" fill="#6366f1" opacity="0.6"/>
    <circle cx="280" cy="180" r="4" fill="#6366f1" opacity="0.5"/>
    <circle cx="320" cy="180" r="5" fill="#a855f7" opacity="0.7"/>
  </g>
  <!-- 五天四夜标注 -->
  <text x="100" y="160" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="9" opacity="0.5">第1天</text>
  <text x="160" y="160" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="9" opacity="0.5">第2天</text>
  <text x="220" y="160" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="9" opacity="0.5">第3天</text>
  <text x="280" y="160" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="9" opacity="0.5">第4天</text>
  <text x="320" y="160" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="9" opacity="0.5">第5天</text>
  <!-- 意志之战标注 -->
  <text x="200" y="210" text-anchor="middle" fill="#5d6b85" font-family="serif" font-size="11" opacity="0.4">五天四夜的意志之战</text>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="15" font-weight="bold">老人与海 · 时间线总结</text>
</svg>
