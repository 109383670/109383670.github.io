<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="constellation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 星座连线 -->
  <g opacity="0.5">
    <line x1="130" y1="80" x2="180" y2="110" stroke="url(#constellation)" stroke-width="0.5" opacity="0.6"/>
    <line x1="180" y1="110" x2="230" y2="90" stroke="url(#constellation)" stroke-width="0.5" opacity="0.6"/>
    <line x1="230" y1="90" x2="270" y2="130" stroke="url(#constellation)" stroke-width="0.5" opacity="0.6"/>
    <line x1="270" y1="130" x2="250" y2="170" stroke="url(#constellation)" stroke-width="0.5" opacity="0.6"/>
    <line x1="250" y1="170" x2="180" y2="110" stroke="url(#constellation)" stroke-width="0.5" opacity="0.4"/>
    <line x1="130" y1="80" x2="150" y2="180" stroke="url(#constellation)" stroke-width="0.5" opacity="0.4"/>
    <line x1="150" y1="180" x2="250" y2="170" stroke="url(#constellation)" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- 星神节点 -->
  <circle cx="130" cy="80" r="5" fill="url(#star)" opacity="0.8"/>
  <circle cx="180" cy="110" r="6" fill="url(#star)" opacity="0.7"/>
  <circle cx="230" cy="90" r="4" fill="url(#star)" opacity="0.6"/>
  <circle cx="270" cy="130" r="5" fill="url(#star)" opacity="0.7"/>
  <circle cx="250" cy="170" r="4" fill="url(#star)" opacity="0.6"/>
  <circle cx="150" cy="180" r="5" fill="url(#star)" opacity="0.7"/>
  <!-- 散星 -->
  <circle cx="100" cy="130" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="310" cy="90" r="1.5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="300" cy="200" r="1" fill="#a855f7" opacity="0.3"/>
  <circle cx="90" cy="200" r="1" fill="#a855f7" opacity="0.3"/>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="15" font-weight="bold">星神谱系细化图 · 长白山</text>
</svg>
