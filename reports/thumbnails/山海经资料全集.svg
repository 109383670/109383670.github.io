<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 古卷 -->
  <g transform="translate(200, 125)">
    <!-- 卷轴展开 -->
    <rect x="-85" y="-45" width="170" height="90" rx="4" fill="none" stroke="url(--gold)" stroke-width="1" opacity="0.45"/>
    <rect x="-75" y="-35" width="150" height="70" rx="2" fill="none" stroke="url(--gold)" stroke-width="0.5" opacity="0.25"/>
    <!-- 卷轴杆 -->
    <rect x="-92" y="-50" width="8" height="100" rx="3" fill="url(--gold)" opacity="0.4"/>
    <rect x="84" y="-50" width="8" height="100" rx="3" fill="url(--gold)" opacity="0.4"/>
    <!-- 文字 -->
    <text x="-40" y="-10" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.5">山</text>
    <text x="-10" y="-10" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.5">海</text>
    <text x="20" y="-10" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.5">经</text>
    <text x="-40" y="18" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.35">异</text>
    <text x="-10" y="18" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.35">兽</text>
    <text x="20" y="18" fill="#c8a96e" font-family="serif" font-size="16" opacity="0.35">录</text>
    <!-- 兽影 -->
    <g transform="translate(55, 20)" opacity="0.3">
      <circle cx="0" cy="-6" r="4" fill="none" stroke="url(--ink)" stroke-width="0.8"/>
      <path d="M -6 2 L 6 2 L 4 8 L -4 8 Z" fill="none" stroke="url(--ink)" stroke-width="0.8"/>
    </g>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="15" font-weight="bold">山海经全图鉴 · 写作资料库</text>
</svg>
