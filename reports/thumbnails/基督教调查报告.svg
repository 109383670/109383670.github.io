<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 背光 -->
  <circle cx="200" cy="100" r="90" fill="url(#light)"/>
  <!-- 十字架 -->
  <g transform="translate(200, 105)">
    <rect x="-6" y="-55" width="12" height="90" rx="3" fill="url(#cross)" opacity="0.7"/>
    <rect x="-40" y="-15" width="80" height="12" rx="3" fill="url(#cross)" opacity="0.65"/>
  </g>
  <!-- 三位一体环 -->
  <g transform="translate(200, 190)" opacity="0.3">
    <circle cx="-25" cy="0" r="16" fill="none" stroke="#c8a96e" stroke-width="0.8"/>
    <circle cx="25" cy="0" r="16" fill="none" stroke="#c8a96e" stroke-width="0.8"/>
    <circle cx="0" cy="-20" r="16" fill="none" stroke="#c8a96e" stroke-width="0.8"/>
    <text x="-25" y="3" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="8">圣父</text>
    <text x="25" y="3" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="8">圣子</text>
    <text x="0" y="-18" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="8">圣灵</text>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#c8a96e" font-family="serif" font-size="15" font-weight="bold">基督教 · 调查报告</text>
</svg>
