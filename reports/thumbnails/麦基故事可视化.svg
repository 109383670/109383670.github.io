<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 故事三角 -->
  <g transform="translate(200, 130)">
    <polygon points="0,-55 -70,40 70,40" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="-60" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="10" opacity="0.6">经典</text>
    <text x="-75" y="50" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="10" opacity="0.6">极简</text>
    <text x="75" y="50" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="10" opacity="0.6">反结构</text>
    <!-- 节拍 -->
    <circle cx="0" cy="0" r="4" fill="url(#accent)" opacity="0.6"/>
    <circle cx="-20" cy="15" r="3" fill="url(--cyan)" opacity="0.5"/>
    <circle cx="15" cy="20" r="3" fill="url(--accent)" opacity="0.5"/>
    <circle cx="-35" cy="30" r="2.5" fill="#06b6d4" opacity="0.4"/>
    <circle cx="30" cy="25" r="2.5" fill="#a855f7" opacity="0.4"/>
  </g>
  <!-- 激励事件闪电 -->
  <path d="M 170 80 L 180 95 L 173 97 L 185 115" stroke="url(#cyan)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <text x="200" y="270" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="15" font-weight="bold">麦基《故事》核心技术</text>
</svg>
