<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 三十六计——兵法卷 -->
  <g transform="translate(200, 130)">
    <!-- 卷轴 -->
    <rect x="-70" y="-40" width="140" height="80" rx="3" fill="#111827" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <rect x="-80" y="-45" width="10" height="90" rx="5" fill="url(#accent)" opacity="0.4"/>
    <rect x="70" y="-45" width="10" height="90" rx="5" fill="url(#accent)" opacity="0.4"/>
    <!-- 孙子兵法文字 -->
    <text x="0" y="-15" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="14" opacity="0.6">计</text>
    <text x="0" y="5" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="14" opacity="0.5">谋</text>
    <text x="0" y="25" text-anchor="middle" fill="#c4b5fd" font-family="serif" font-size="14" opacity="0.5">势</text>
  </g>
  <!-- 兵器交叉 -->
  <g opacity="0.3" transform="translate(200, 130)">
    <line x1="-50" y1="-60" x2="50" y2="60" stroke="url(#cyan)" stroke-width="1"/>
    <line x1="50" y1="-60" x2="-50" y2="60" stroke="url(#cyan)" stroke-width="1"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="17" font-weight="bold">三十六计</text>
</svg>
