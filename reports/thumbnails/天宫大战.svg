<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a15"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 三百女神象征——三轮月 -->
  <circle cx="160" cy="110" r="25" fill="none" stroke="url(#fire)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="100" r="30" fill="none" stroke="url(#ice)" stroke-width="2" opacity="0.7"/>
  <circle cx="240" cy="110" r="25" fill="none" stroke="url(#fire)" stroke-width="2" opacity="0.6"/>
  <!-- 萨满鼓 -->
  <ellipse cx="200" cy="160" rx="45" ry="12" fill="none" stroke="url(#fire)" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="200" cy="160" rx="45" ry="12" fill="#dc2626" opacity="0.05"/>
  <!-- 创世纹 -->
  <g opacity="0.4" stroke="url(#fire)" stroke-width="0.8" fill="none">
    <path d="M 170 155 Q 180 145 190 155 Q 200 165 210 155 Q 220 145 230 155"/>
    <path d="M 170 165 Q 180 175 190 165 Q 200 155 210 165 Q 220 175 230 165"/>
  </g>
  <!-- 神话粒子 -->
  <circle cx="120" cy="80" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="280" cy="85" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="100" cy="180" r="1" fill="#06b6d4" opacity="0.3"/>
  <circle cx="310" cy="190" r="1" fill="#06b6d4" opacity="0.3"/>
  <text x="200" y="270" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="14" font-weight="bold">天宫大战 · 满族萨满创世神话</text>
</svg>
