<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#04080d"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 星空 -->
  <g opacity="0.3">
    <circle cx="60" cy="60" r="1" fill="#c8a96e"/>
    <circle cx="120" cy="40" r="1" fill="#c8a96e"/>
    <circle cx="320" cy="55" r="1" fill="#c8a96e"/>
    <circle cx="350" cy="130" r="1" fill="#c8a96e"/>
    <circle cx="40" cy="160" r="1" fill="#c8a96e"/>
    <circle cx="370" cy="80" r="1" fill="#c8a96e"/>
  </g>
  <!-- 新月 -->
  <g transform="translate(200, 80)">
    <circle cx="0" cy="0" r="28" fill="#c8a96e" opacity="0.8"/>
    <circle cx="10" cy="-4" r="25" fill="#0d1520"/>
    <circle cx="7" cy="-2" r="10" fill="none" stroke="#e2c485" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- 星 -->
  <path d="M 200 62 L 202.5 69 L 210 69 L 204 73.5 L 206.5 80.5 L 200 76 L 193.5 80.5 L 196 73.5 L 190 69 L 197.5 69 Z" fill="#e2c485" opacity="0.7"/>
  <!-- 清真寺穹顶 -->
  <g transform="translate(200, 155)" opacity="0.6">
    <!-- 主体 -->
    <rect x="-60" y="20" width="120" height="45" fill="none" stroke="url(#green)" stroke-width="1.5" opacity="0.5"/>
    <!-- 穹顶 -->
    <path d="M -30 20 Q -30 -5 0 -5 Q 30 -5 30 20" fill="none" stroke="url(--green)" stroke-width="1.5" opacity="0.5"/>
    <!-- 尖塔 -->
    <line x1="-75" y1="65" x2="-75" y2="10" stroke="url(--green)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-75" cy="6" r="4" fill="none" stroke="url(--green)" stroke-width="1" opacity="0.5"/>
    <line x1="75" y1="65" x2="75" y2="20" stroke="url(--green)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="75" cy="16" r="4" fill="none" stroke="url(--green)" stroke-width="1" opacity="0.5"/>
    <!-- 门 -->
    <path d="M -10 65 L -10 50 Q 0 40 10 50 L 10 65 Z" fill="url(--green)" opacity="0.3"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#6ee7b7" font-family="serif" font-size="15" font-weight="bold">伊斯兰教 · 综合研究报告</text>
</svg>
