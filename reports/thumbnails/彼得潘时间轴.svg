<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 永无岛星尘 -->
  <g opacity="0.4">
    <circle cx="80" cy="80" r="1.5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="320" cy="75" r="1.5" fill="#fbbf24" opacity="0.4"/>
    <circle cx="100" cy="150" r="1" fill="#10b981" opacity="0.3"/>
    <circle cx="310" cy="160" r="1" fill="#10b981" opacity="0.3"/>
    <circle cx="200" cy="60" r="2" fill="#fbbf24" opacity="0.5"/>
    <circle cx="60" cy="120" r="1" fill="#06b6d4" opacity="0.3"/>
    <circle cx="340" cy="110" r="1" fill="#06b6d4" opacity="0.3"/>
  </g>
  <!-- 飞翔的彼得潘剪影 -->
  <g transform="translate(200, 120)" opacity="0.5">
    <!-- 身体 -->
    <circle cx="0" cy="-15" r="8" fill="url(#accent)" opacity="0.4"/>
    <path d="M -5 -8 L 5 -8 L 8 10 L -8 10 Z" fill="url(#accent)" opacity="0.3"/>
    <!-- 飞翔手臂 -->
    <line x1="-5" y1="-5" x2="-18" y2="-15" stroke="url(--accent)" stroke-width="2" opacity="0.5"/>
    <line x1="5" y1="-5" x2="18" y2="-15" stroke="url(--accent)" stroke-width="2" opacity="0.5"/>
    <!-- 腿 -->
    <line x1="-3" y1="10" x2="-6" y2="22" stroke="url(--accent)" stroke-width="2" opacity="0.4"/>
    <line x1="3" y1="10" x2="6" y2="22" stroke="url(--accent)" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- 精灵粉尘 -->
  <circle cx="170" cy="100" r="2" fill="url(#star)" opacity="0.6"/>
  <circle cx="230" cy="95" r="2" fill="url(#star)" opacity="0.5"/>
  <circle cx="155" cy="130" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="245" cy="135" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <!-- 海盗船帆远景 -->
  <g opacity="0.2" transform="translate(330, 180)">
    <path d="M 0 0 L 20 -30 L 25 0 Z" fill="#06b6d4"/>
    <line x1="12" y1="-30" x2="12" y2="10" stroke="#06b6d4" stroke-width="0.5"/>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#6ee7b7" font-family="serif" font-size="15" font-weight="bold">彼得·潘 · 时间轴</text>
</svg>
