<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Ni 棱镜 (三角) -->
  <polygon points="200,60 170,110 230,110" fill="none" stroke="url(#prism)" stroke-width="2" opacity="0.6"/>
  <polygon points="200,60 170,110 230,110" fill="url(#prism)" opacity="0.08"/>
  <text x="200" y="95" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="11" opacity="0.7">Ni</text>
  <!-- Fi 反光镜 (椭圆) -->
  <ellipse cx="140" cy="160" rx="30" ry="18" fill="none" stroke="url(#mirror)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="140" cy="160" rx="30" ry="18" fill="url(#mirror)" opacity="0.06"/>
  <text x="140" y="164" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="11" opacity="0.7">Fi</text>
  <!-- Ti 透镜 (圆) -->
  <circle cx="260" cy="160" r="20" fill="none" stroke="url(#lens)" stroke-width="2" opacity="0.6"/>
  <circle cx="260" cy="160" r="20" fill="url(#lens)" opacity="0.06"/>
  <text x="260" y="164" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="11" opacity="0.7">Ti</text>
  <!-- 连线 -->
  <line x1="195" y1="110" x2="150" y2="145" stroke="url(#prism)" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="110" x2="250" y2="145" stroke="url(#prism)" stroke-width="0.5" opacity="0.3"/>
  <line x1="165" y1="160" x2="240" y2="160" stroke="#a855f7" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 3"/>
  <!-- Se 输出箭头 -->
  <path d="M 260 180 L 260 210 M 252 202 L 260 210 L 268 202" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.4"/>
  <text x="260" y="225" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="10" opacity="0.5">Se</text>
  <text x="200" y="270" text-anchor="middle" fill="#a5b4fc" font-family="serif" font-size="14" font-weight="bold">三通道 × 四位置 · 咬合关系</text>
</svg>
