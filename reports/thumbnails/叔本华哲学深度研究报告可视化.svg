<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#080f1a"/>
    </linearGradient>
    <linearGradient id="will" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e6edf7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 意志之眼 -->
  <ellipse cx="200" cy="130" rx="70" ry="40" fill="url(#veil)" opacity="0.6"/>
  <ellipse cx="200" cy="130" rx="55" ry="32" fill="none" stroke="url(#will)" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="200" cy="130" rx="35" ry="22" fill="url(#will)" opacity="0.2"/>
  <circle cx="200" cy="130" r="12" fill="#06b6d4" opacity="0.5"/>
  <circle cx="200" cy="130" r="5" fill="#0a0a1a"/>
  <circle cx="202" cy="128" r="2" fill="#67e8f9" opacity="0.8"/>
  <!-- 表象之幕 -->
  <line x1="130" y1="90" x2="270" y2="90" stroke="url(#will)" stroke-width="0.5" opacity="0.3"/>
  <line x1="130" y1="170" x2="270" y2="170" stroke="url(#will)" stroke-width="0.5" opacity="0.3"/>
  <!-- 悲观迷雾 -->
  <ellipse cx="100" cy="200" rx="40" ry="8" fill="#1e3a5f" opacity="0.2"/>
  <ellipse cx="300" cy="210" rx="45" ry="9" fill="#1e3a5f" opacity="0.15"/>
  <text x="200" y="270" text-anchor="middle" fill="#67e8f9" font-family="serif" font-size="15" font-weight="bold">叔本华哲学深度研究</text>
</svg>
