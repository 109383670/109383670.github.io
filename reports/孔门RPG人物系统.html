<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孔门RPG · 人物系统</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"KaiTi","楷体","STKaiti","Ma Shan Zheng",serif;background:#1a120b;color:#e8d5b7;min-height:100vh;overflow-x:hidden;}
.back{position:fixed;top:16px;left:16px;color:#DEB887;text-decoration:none;font-size:14px;z-index:20;opacity:0.7;background:rgba(26,18,11,0.8);padding:6px 12px;border-radius:8px;}
.back:hover{opacity:1;}
nav{position:sticky;top:0;z-index:15;background:rgba(26,18,11,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(205,133,63,0.2);padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
nav button{padding:8px 18px;border:1px solid rgba(205,133,63,0.3);border-radius:20px;background:transparent;color:#a08070;font:inherit;font-size:14px;cursor:pointer;transition:all 0.2s;}
nav button:hover,.nav-active{background:rgba(205,133,63,0.2);color:#DEB887;border-color:#CD853F;}

.main-layout{display:flex;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding:20px;gap:24px;}
.roster{flex:0 0 200px;display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow-y:auto;}
.roster-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(205,133,63,0.06);border:1px solid rgba(205,133,63,0.15);border-radius:8px;cursor:pointer;color:#e8d5b7;font:inherit;font-size:13px;transition:all 0.2s;text-align:left;}
.roster-btn:hover{background:rgba(205,133,63,0.15);}
.roster-btn.active{background:rgba(205,133,63,0.22);border-color:#CD853F;}
.roster-btn .icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}

.main-panel{flex:1;min-width:400px;display:flex;flex-direction:column;gap:20px;}
.char-header{display:flex;align-items:center;gap:16px;padding:20px;background:rgba(139,69,19,0.12);border-radius:16px;border:1px solid rgba(139,69,19,0.3);}
.char-avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;border:3px solid #CD853F;}
.char-info h2{font-size:26px;font-weight:normal;margin-bottom:2px;}
.char-info .titles{font-size:13px;color:#DEB887;}
.char-info .aka{font-size:12px;color:#a08070;margin-top:2px;}

.section-title{font-size:14px;font-weight:normal;color:#DEB887;margin-bottom:12px;letter-spacing:2px;}
.radar-section{background:rgba(139,69,19,0.08);border-radius:16px;padding:16px;border:1px solid rgba(139,69,19,0.2);text-align:center;}

.stat-bars{display:flex;flex-direction:column;gap:6px;padding:14px;background:rgba(139,69,19,0.08);border-radius:12px;border:1px solid rgba(139,69,19,0.2);}
.stat-row{display:flex;align-items:center;gap:8px;}
.stat-label{width:28px;text-align:center;font-size:13px;color:#DEB887;flex-shrink:0;}
.stat-bar-bg{flex:1;height:16px;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:8px;transition:width 0.5s ease;}
.stat-val{width:20px;text-align:center;font-size:11px;color:#a08070;flex-shrink:0;}

.quotes{background:rgba(139,69,19,0.08);border-radius:16px;padding:18px;border:1px solid rgba(139,69,19,0.2);}
.quote-item{padding:8px 0;border-bottom:1px solid rgba(205,133,63,0.08);}
.quote-item:last-child{border-bottom:none;}
.quote-src{font-size:10px;color:#7a6050;margin-bottom:2px;}
.quote-original{font-size:15px;color:#e8d5b7;margin-bottom:2px;}
.quote-trans{font-size:12px;color:#a08070;}

.side-panel{flex:0 0 300px;display:flex;flex-direction:column;gap:16px;}
.rel-graph{background:rgba(139,69,19,0.08);border-radius:16px;padding:14px;border:1px solid rgba(139,69,19,0.2);text-align:center;}
.achievements{background:rgba(139,69,19,0.08);border-radius:16px;padding:14px;border:1px dashed rgba(205,133,63,0.25);}
.ach{padding:5px 0;font-size:12px;color:#a08070;border-bottom:1px solid rgba(205,133,63,0.06);display:flex;align-items:center;gap:6px;}

/* 言语宝库 */
.speech-bank{display:none;flex-direction:column;gap:16px;padding:20px;max-width:1200px;margin:0 auto;}
.speech-bank.active{display:flex;}
.speech-search{width:100%;padding:12px 16px;background:rgba(139,69,19,0.12);border:1px solid rgba(205,133,63,0.3);border-radius:12px;color:#e8d5b7;font:inherit;font-size:15px;outline:none;}
.speech-search::placeholder{color:#7a6050;}
.speech-cats{display:flex;gap:8px;flex-wrap:wrap;}
.speech-cats button{padding:6px 14px;border:1px solid rgba(205,133,63,0.25);border-radius:16px;background:transparent;color:#a08070;font:inherit;font-size:13px;cursor:pointer;transition:all 0.2s;}
.speech-cats button:hover,.scat-active{background:rgba(205,133,63,0.2);color:#DEB887;border-color:#CD853F;}
.speech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;}
.speech-card{background:rgba(139,69,19,0.1);border:1px solid rgba(139,69,19,0.2);border-radius:12px;padding:14px;}
.speech-card .s-src{font-size:10px;color:#7a6050;}
.speech-card .s-orig{font-size:16px;color:#e8d5b7;margin:4px 0;}
.speech-card .s-trans{font-size:12px;color:#a08070;}
.speech-card .s-cat{display:inline-block;background:rgba(205,133,63,0.15);color:#DEB887;padding:2px 8px;border-radius:8px;font-size:10px;margin-top:4px;}

.footnote{text-align:center;padding:30px;color:#5a4030;font-size:12px;}

@media(max-width:1000px){.main-layout{flex-direction:column;}.roster{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;max-height:none;gap:4px;}.roster-btn{font-size:11px;padding:6px 10px;}.roster-btn .icon{width:24px;height:24px;font-size:12px;}.side-panel{flex:0 0 auto;}.speech-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<a class="back" href="INDEX.html">← 返回</a>
<nav>
  <button class="nav-active" onclick="switchTab('roster','this')">🎮 人物系统</button>
  <button onclick="switchTab('speech','this')">📜 孔子言语宝库</button>
</nav>

<div class="main-layout" id="rosterView">
  <div class="roster" id="roster"></div>
  <div class="main-panel">
    <div class="char-header" id="charHeader"></div>
    <div class="radar-section" id="radarSection"></div>
    <div class="stat-bars" id="statBars"></div>
    <div class="quotes" id="quotes"></div>
  </div>
  <div class="side-panel">
    <div class="rel-graph"><div class="section-title">师承关系图</div><svg id="relSvg" viewBox="0 0 280 320"></svg></div>
    <div class="achievements" id="achievements"><div class="section-title">🏆 隐藏成就</div></div>
  </div>
</div>

<div class="speech-bank" id="speechView">
  <input type="text" class="speech-search" id="speechSearch" placeholder="🔍 搜索孔子语录…… 如：仁、君子、学、天命" oninput="filterSpeech()">
  <div class="speech-cats" id="speechCats"></div>
  <div class="speech-grid" id="speechGrid"></div>
</div>

<div class="footnote">数据来源：《论语》二十篇 · 半纸浮生载残躯</div>

<script>
const C = {仁:'#e74c3c',义:'#f39c12',礼:'#2ecc71',智:'#3498db',信:'#9b59b6',勇:'#e67e22',政:'#1abc9c',文:'#e91e63',德:'#ff9800',孝:'#00bcd4'};

const SK = ['仁','义','礼','智','信','勇','政'];

const chars = [
{id:'kongzi',n:'孔子',ak:'孔丘·仲尼',ti:'至圣先师·万世师表',e:'👑',bg:'#8B4513',st:{仁:5,义:5,礼:5,智:5,信:5,勇:3,政:5},ac:['🌅逝者如斯夫','🍖三月不知肉味','🌊乘桴浮于海','📚韦编三绝','👂六十而耳顺','🎵在齐闻韶'],qs:[
{o:'学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？',t:'学了按时练习，很快乐；朋友远道而来，很高兴；别人不了解我也不生气，这才是君子。',s:'学而1.1'},
{o:'吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩。',t:'我十五岁立志学习，三十岁自立，四十岁不再迷惑，五十岁明白天命，六十岁什么话都听得进，七十岁随心所欲不犯规。',s:'为政2.4'},
{o:'己所不欲，勿施于人。',t:'自己不愿意承受的，别强加给别人。',s:'卫灵公15.24'},
{o:'不义而富且贵，于我如浮云。',t:'不正当地得来的富贵，在我看来就像浮云。',s:'述而7.16'},
{o:'三人行，必有我师焉。择其善者而从之，其不善者而改之。',t:'三人同行，必有值得我学习的。选好的学，不好的引以为戒。',s:'述而7.22'},
{o:'饭疏食饮水，曲肱而枕之，乐亦在其中矣。',t:'吃粗粮喝白水，弯着胳膊当枕头，快乐也在其中。',s:'述而7.16'},
{o:'朝闻道，夕死可矣。',t:'早上闻知大道，晚上死了也甘心。',s:'里仁4.8'},
{o:'君子坦荡荡，小人长戚戚。',t:'君子心胸坦荡，小人总是忧戚。',s:'述而7.37'},
{o:'知之为知之，不知为不知，是知也。',t:'知道就是知道，不知道就是不知道，这才是真智慧。',s:'为政2.17'},
{o:'岁寒，然后知松柏之后凋也。',t:'天冷了，才知道松柏是最后凋零的。',s:'子罕9.28'}
]},
{id:'yanhui',n:'颜回',ak:'颜渊·子渊',ti:'德行科第一·复圣',e:'🌟',bg:'#2c3e50',st:{仁:5,义:4,礼:4,智:4,信:4,勇:1,政:1},ac:['🍚箪食瓢饮','💎不贰过','🕊️三月不违仁','😢不幸早逝','🔇不违如愚','📖闻一知十'],qs:[
{o:'贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！',t:'颜回真贤德！一碗饭一瓢水住在陋巷，别人受不了这种苦，他却不改快乐。',s:'雍也6.11'},
{o:'有颜回者好学，不迁怒，不贰过。不幸短命死矣。',t:'颜回好学，不迁怒于人，不犯同样的错。不幸短命死了。',s:'雍也6.3'},
{o:'回也，其心三月不违仁，其余则日月至焉而已矣。',t:'颜回心里能三个月不离仁，其他人只能保持几天或一个月。',s:'雍也6.7'},
{o:'吾与回言终日，不违如愚。退而省其私，亦足以发。回也不愚。',t:'我跟颜回讲一整天，他从不反驳像很笨。回去反省后却能发挥。颜回不笨。',s:'为政2.9'},
{o:'子谓子贡曰：女与回也孰愈？对曰：赐也何敢望回？回也闻一以知十。',t:'孔子问子贡你跟颜回谁强？子贡说我怎敢比，他闻一知十。',s:'公冶长5.9'},
{o:'颜渊喟然叹曰：仰之弥高，钻之弥坚。瞻之在前，忽焉在后。',t:'颜回感叹：夫子的道越仰望越高，越钻研越坚实。看着在前面，忽然又在后面。',s:'子罕9.11'},
{o:'回也视予犹父也，予不得视犹子也。',t:'颜回把我看作父亲，我却不能把他看作儿子（指葬礼规格限制）。',s:'先进11.11'},
{o:'颜渊问仁。子曰：克己复礼为仁。',t:'颜回问仁。孔子说：约束自己回归礼，就是仁。',s:'颜渊12.1'}
]},
{id:'zilu',n:'子路',ak:'仲由·季路',ti:'勇武第一·政事科',e:'⚔️',bg:'#c0392b',st:{仁:2,义:4,礼:2,智:2,信:3,勇:5,政:4},ac:['🛡️结缨而死','😤孔门第一杠精','👊唯一敢怼孔子','🎯闻斯行诸','🚫孔子骂得最多的人','⚡子路有闻未之能行'],qs:[
{o:'子路有闻，未之能行，唯恐有闻。',t:'子路听到道理还没做到，就怕再听新的。',s:'公冶长5.14'},
{o:'野哉，由也！君子于其所不知，盖阙如也。',t:'子路真野！君子对自己不懂的事，应该保留不说。',s:'子路13.3'},
{o:'愿车马衣轻裘与朋友共，敝之而无憾。',t:'愿把车马皮袍和朋友共享，用坏了不心疼。',s:'公冶长5.26'},
{o:'子路问事君。子曰：勿欺也，而犯之。',t:'子路问怎么事奉君主。孔子说：不欺骗他，但可以当面冒犯。',s:'宪问14.22'},
{o:'由也升堂矣，未入于室也。',t:'子路已经进了厅堂，但还没进到内室（比喻学问境界）。',s:'先进11.15'},
{o:'子路曰：愿闻子之志。子曰：老者安之，朋友信之，少者怀之。',t:'子路问夫子的志向。孔子说让老人安心、朋友信任、年轻人怀念。',s:'公冶长5.26'},
{o:'子路问成人。子曰：若臧武仲之知，公绰之不欲……',t:'子路问什么是完人。孔子举了多个先贤的标准。',s:'宪问14.12'},
{o:'子路愠见曰：君子亦有穷乎？子曰：君子固穷，小人穷斯滥矣。',t:'子路生气见孔子：君子也有穷困的时候吗？孔子说君子能守住穷困，小人穷了就乱来。',s:'卫灵公15.2'}
]},
{id:'zigong',n:'子贡',ak:'端木赐·子贡',ti:'言语科第一·儒商鼻祖',e:'💰',bg:'#16a085',st:{仁:3,义:3,礼:4,智:5,信:4,勇:2,政:5},ac:['🏦儒商第一人','🗣️外交鬼才','🛡️为孔子守墓六年','📉亿则屡中','💎瑚琏之器','🎤言语科首席'],qs:[
{o:'子贡曰：我不欲人之加诸我也，吾亦欲无加诸人。',t:'我不愿别人强加于我，我也不强加于别人。',s:'公冶长5.12'},
{o:'赐也何敢望回？回也闻一以知十，赐也闻一以知二。',t:'我怎敢和颜回比？他听一知十，我只能听一知二。',s:'公冶长5.9'},
{o:'夫子之墙数仞，不得其门而入，不见宗庙之美百官之富。',t:'夫子的墙有好几丈高，找不到门进去，看不见宗庙的华美屋舍的富丽。',s:'子张19.23'},
{o:'子贡曰：贫而无谄，富而无骄，何如？子曰：可也。未若贫而乐，富而好礼者也。',t:'子贡问贫穷不谄媚富足不骄傲怎么样？孔子说可以，不如贫穷却快乐、富足却好礼。',s:'学而1.15'},
{o:'子贡问曰：有一言而可以终身行之者乎？子曰：其恕乎！己所不欲勿施于人。',t:'子贡问有没有一个字可以终身奉行？孔子说就是恕吧！己所不欲勿施于人。',s:'卫灵公15.24'},
{o:'子贡曰：夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。',t:'子贡说夫子的礼乐文章可以听到，但夫子谈人性与天道的言论很少听到。',s:'公冶长5.13'},
{o:'赐也，女以予为多学而识之者与？对曰：然，非与？曰：非也，予一以贯之。',t:'子贡你以为我是学得多记得多吗？子贡说是。孔子说不是，我是一以贯之。',s:'卫灵公15.3'},
{o:'子贡问为仁。子曰：工欲善其事，必先利其器。',t:'子贡问怎么行仁。孔子说工匠要做好活儿，必先磨利工具。',s:'卫灵公15.10'}
]},
{id:'zengzi',n:'曾子',ak:'曾参·子舆',ti:'宗圣·孝道代表',e:'🙏',bg:'#8e44ad',st:{仁:4,义:3,礼:4,智:3,信:4,勇:2,政:2},ac:['📝三省吾身','📖著《大学》','👦宗圣传承','🌉任重道远','🐢参也鲁','✨临终易箦'],qs:[
{o:'吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？',t:'我每天三次反省：替人谋划尽心了吗？和朋友交往守信了吗？老师教的练了吗？',s:'学而1.4'},
{o:'慎终追远，民德归厚矣。',t:'慎重对待丧礼追念先祖，民风就淳厚了。',s:'学而1.9'},
{o:'士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？',t:'读书人不能不心胸宽广意志坚定，责任重道路远。把仁作为自己的责任，死后才罢休。',s:'泰伯8.7'},
{o:'可以托六尺之孤，可以寄百里之命，临大节而不可夺也——君子人与？君子人也。',t:'可以把幼君托付给他，可以把国家命运寄托给他，面临生死大节不动摇——这是君子吗？这就是君子。',s:'泰伯8.6'},
{o:'鸟之将死，其鸣也哀；人之将死，其言也善。',t:'鸟快死时叫声悲哀，人快死时说的话是善意的。',s:'泰伯8.4'},
{o:'曾子曰：以能问于不能，以多问于寡；有若无，实若虚，犯而不校。',t:'有才能却向没才能的人请教，知识多却向知识少的人请教；有像没有，充实像空虚，被冒犯不计较。',s:'泰伯8.5'},
{o:'夫子之道，忠恕而已矣。',t:'夫子的道，就是忠和恕两个字罢了。',s:'里仁4.15'},
{o:'曾子有疾，召门弟子曰：启予足！启予手！《诗》云战战兢兢如临深渊如履薄冰。',t:'曾子病重，叫弟子来看他的手脚完好，说一辈子战战兢兢保全身体（孝道）。',s:'泰伯8.3'}
]},
{id:'zixia',n:'子夏',ak:'卜商·子夏',ti:'文学科第一·经学大师',e:'📜',bg:'#2980b9',st:{仁:3,义:2,礼:5,智:4,信:3,勇:1,政:3},ac:['📚传《诗》《春秋》','🏛️经学奠基人','⚖️商也不及','🏫西河设教','🧠切问近思','👁️贤贤易色'],qs:[
{o:'贤贤易色；事父母能竭其力；事君能致其身；与朋友交言而有信。虽曰未学，吾必谓之学矣。',t:'重贤德不重容貌，事奉父母尽心，事奉君主献身，对朋友说话讲信用。就算没学问，我也说他有学问。',s:'学而1.7'},
{o:'仕而优则学，学而优则仕。',t:'做官有余力就学习，学习有余力就做官。',s:'子张19.13'},
{o:'博学而笃志，切问而近思，仁在其中矣。',t:'广博学习坚定志向，恳切发问思考身边事，仁就在其中了。',s:'子张19.6'},
{o:'日知其所亡，月无忘其所能，可谓好学也已矣。',t:'每天学一些不知道的，每月不忘已经会的，就算好学了。',s:'子张19.5'},
{o:'百工居肆以成其事，君子学以致其道。',t:'各种工匠在作坊里完成工作，君子通过学习达到他的道。',s:'子张19.7'},
{o:'小人之过也必文。',t:'小人犯了错一定要文饰掩饰。',s:'子张19.8'},
{o:'子夏曰：大德不逾闲，小德出入可也。',t:'大节上不越界限，小节上有出入倒也可以。',s:'子张19.11'},
{o:'子夏曰：君子有三变：望之俨然，即之也温，听其言也厉。',t:'君子有三种变化：远望庄严，接近温和，听他说话严厉。',s:'子张19.9'}
]},
{id:'ranyou',n:'冉有',ak:'冉求·子有',ti:'政事科·多才多艺',e:'🏛️',bg:'#d35400',st:{仁:2,义:2,礼:3,智:4,信:3,勇:1,政:5},ac:['🏗️季氏宰','📐多才多艺','🔄现实主义者','😰非不说子之道','⚡闻斯行之（唯恐不及）','🏃‍♂️画地为牢之后勤'],qs:[
{o:'求也艺，于从政乎何有？',t:'冉求多才多艺，从政有什么难的？',s:'雍也6.8'},
{o:'非不说子之道，力不足也。',t:'不是不喜欢夫子的道，是我能力不够。',s:'雍也6.12'},
{o:'冉有曰：夫子为卫君乎？子贡曰：诺，吾将问之。',t:'冉有问：夫子会帮卫君吗？子贡说我替你去问。',s:'述而7.15'},
{o:'求！周任有言曰：陈力就列，不能者止。',t:'冉有！周任说过：能出力就任职，不能就辞职。',s:'季氏16.1'},
{o:'求也退，故进之；由也兼人，故退之。',t:'冉有畏缩不前，所以推他一把；子路勇猛过人，所以拉他一把。',s:'先进11.22'},
{o:'冉子退朝。子曰：何晏也？对曰：有政。子曰：其事也。如有政，虽不吾以，吾其与闻之。',t:'冉有退朝回来晚了。孔子说怎么这么晚？冉有说有政事。孔子说那是事务吧，有政事我怎么会不知道。',s:'子路13.14'},
{o:'冉子与之粟五秉。子曰：赤之适齐也，乘肥马衣轻裘。吾闻之也，君子周急不继富。',t:'冉有给公西华的母亲送了很多米。孔子说公西华去齐国很富有，君子救急不锦上添花。',s:'雍也6.4'},
{o:'季氏富于周公，而求也为之聚敛而附益之。子曰：非吾徒也，小子鸣鼓而攻之可也。',t:'季氏比周公还富，冉求还帮他搜刮。孔子说这不是我徒弟，你们可以敲鼓去攻击他。',s:'先进11.17'}
]},
{id:'zizhang',n:'子张',ak:'颛孙师·子张',ti:'孔门后进·偏激派',e:'🎯',bg:'#e74c3c',st:{仁:3,义:2,礼:2,智:3,信:3,勇:3,政:4},ac:['🔥师也过','📝善问政事','🕸️自成一派（子张之儒）','🔍问干禄','✍️书诸绅','🧗‍♂️执德不弘'],qs:[
{o:'子张学干禄。子曰：多闻阙疑，慎言其余，则寡尤；多见阙殆，慎行其余，则寡悔。',t:'子张问怎么求官。孔子说多听、保留疑惑、谨慎说话就少犯错；多看、避开危险、谨慎行动就少后悔。',s:'为政2.18'},
{o:'师也过，商也不及。',t:'子张过头了，子夏又不够。',s:'先进11.16'},
{o:'子张问：十世可知也？子曰：殷因于夏礼，所损益可知也；周因于殷礼，所损益可知也。',t:'子张问十世以后的事能预知吗？孔子说殷代继承了夏礼，周代继承了殷礼，增减可推知未来。',s:'为政2.23'},
{o:'子张问行。子曰：言忠信，行笃敬，虽蛮貊之邦行矣……子张书诸绅。',t:'子张问怎么到处行得通。孔子说说话忠诚信实、行为笃厚恭敬。子张把这话写在腰带上。',s:'卫灵公15.6'},
{o:'子张曰：士见危致命，见得思义，祭思敬，丧思哀，其可已矣。',t:'读书人见到危险敢于献身，见到利益想到道义，祭祀时诚敬，居丧时哀伤，就可以了。',s:'子张19.1'},
{o:'子张曰：执德不弘，信道不笃，焉能为有？焉能为亡？',t:'坚守道德不发扬光大，信仰道理不坚定，这种人算有吗？算没有吗？',s:'子张19.2'},
{o:'子张问崇德辨惑。子曰：主忠信，徙义，崇德也。',t:'子张问怎么提高品德辨别迷惑。孔子说以忠诚信实为主，向义靠拢。',s:'颜渊12.10'}
]},
{id:'zaiwo',n:'宰我',ak:'宰予·子我',ti:'言语科·争议人物',e:'😴',bg:'#95a5a6',st:{仁:2,义:1,礼:2,智:4,信:1,勇:1,政:2},ac:['😴昼寝被骂','🗣️口才一流','⚡怀疑精神','😈孔子最失望的弟子','🕐三年之丧争议','🎙️言语科天才'],qs:[
{o:'朽木不可雕也，粪土之墙不可杇也！于予与何诛？',t:'烂木头没法雕，粪土墙没法刷！对宰我还能说什么？',s:'公冶长5.10'},
{o:'始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。',t:'从前我听了话就相信行为，现在听了话还要观察行为——是宰我让我改变的。',s:'公冶长5.10'},
{o:'宰我问：三年之丧，期已久矣。君子三年不为礼，礼必坏；三年不为乐，乐必崩。',t:'宰我问守孝三年太久了吧？君子三年不习礼乐就会荒废。',s:'阳货17.21'},
{o:'予之不仁也！子生三年，然后免于父母之怀。',t:'宰我真不仁！孩子出生三年才脱离父母怀抱，守孝三年是回报。',s:'阳货17.21'},
{o:'宰我问曰：仁者虽告之曰井有仁焉，其从之也？',t:'宰我问：如果告诉仁者井里有仁，他会跳下去吗？',s:'雍也6.26'},
{o:'哀公问社于宰我。宰我对曰：夏后氏以松，殷人以柏，周人以栗。曰：使民战栗。',t:'鲁哀公问宰我社树用什么。宰我答夏用松殷用柏周用栗子（暗示使民战栗）。',s:'八佾3.21'}
]},
{id:'zhonggong',n:'仲弓',ak:'冉雍·仲弓',ti:'德行科·南面之才',e:'🐂',bg:'#27ae60',st:{仁:4,义:3,礼:4,智:3,信:3,勇:1,政:4},ac:['👑可使南面','🐂出身低微逆袭','✨德行科翘楚','🗣️居敬而行简','🛡️犁牛之子','🫅王者之器'],qs:[
{o:'雍也可使南面。',t:'冉雍这个人，可以坐北朝南当君主。',s:'雍也6.1'},
{o:'犁牛之子骍且角，虽欲勿用，山川其舍诸？',t:'耕牛的儿子毛色纯赤角又整齐，就算不想用它祭祀，山川之神会放弃吗？',s:'雍也6.6'},
{o:'仲弓问仁。子曰：出门如见大宾，使民如承大祭。己所不欲勿施于人。在邦无怨在家无怨。',t:'仲弓问仁。孔子说出门像接待贵宾，役使百姓像承办大祭。己所不欲勿施于人。',s:'颜渊12.2'},
{o:'仲弓为季氏宰，问政。子曰：先有司，赦小过，举贤才。',t:'仲弓做季氏家臣问怎么行政。孔子说：先派定管事人员、原谅小错、提拔贤才。',s:'子路13.2'},
{o:'居敬而行简，以临其民，不亦可乎？居简而行简，无乃大简乎？',t:'心存敬畏而行事简洁来治理百姓，不是很好吗？心存随便又行事随便，那不是太随便了吗？',s:'雍也6.2'}
]},
{id:'youzi',n:'有子',ak:'有若·子有',ti:'状似孔子·孔门继承者',e:'🦅',bg:'#5d4037',st:{仁:4,义:3,礼:5,智:3,信:3,勇:1,政:3},ac:['👥状似孔子','📜《论语》开篇第二','⚖️礼之用和为贵','🏛️弟子拥立代孔子','💡务本思想','📖有子之言收录'],qs:[
{o:'其为人也孝弟，而好犯上者，鲜矣；不好犯上而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！',t:'孝敬父母友爱兄弟的人很少犯上，不犯上的人不会作乱。君子专注根本，根本确立了道就产生了。孝悌就是仁的根本！',s:'学而1.2'},
{o:'礼之用，和为贵。先王之道斯为美，小大由之。有所不行，知和而和，不以礼节之，亦不可行也。',t:'礼的运用以和谐为贵。但只知道和谐而不用礼来约束，也是行不通的。',s:'学而1.12'},
{o:'信近于义，言可复也。恭近于礼，远耻辱也。因不失其亲，亦可宗也。',t:'守信接近义，诺言可以兑现；恭敬接近礼，能远离耻辱；所依靠的是亲信之人，也可以尊崇。',s:'学而1.13'},
{o:'哀公问于有若曰：年饥用不足，如之何？有若对曰：盍彻乎？',t:'鲁哀公问有若饥荒年财政不够怎么办。有若说为什么不收十分之一的税呢？',s:'颜渊12.9'},
{o:'有子曰：其言也讱。……为之难，言之得无讱乎？',t:'有子说说话要迟钝谨慎。……做起来难，说话能不迟钝吗？',s:'颜渊12.3'},
{o:'有子见问于曾子曰：问丧于夫子乎？曰：闻之矣。丧欲速贫，死欲速朽。',t:'有子见曾子问夫子说过丧事的事吗。曾子说夫子说过丢了官最好快点穷，死了最好快点朽。',s:'檀弓上（礼记）'}
]},
{id:'ziyou',n:'子游',ak:'言偃·子游',ti:'文学科·礼乐专家',e:'🎵',bg:'#006064',st:{仁:3,义:2,礼:5,智:4,信:3,勇:1,政:4},ac:['🏙️武城宰（弦歌而治）','🎶礼乐教化实践者','📚文学科双璧之一','🐔割鸡焉用牛刀','🤝大同篇记录者'],qs:[
{o:'子游为武城宰。子之武城，闻弦歌之声。夫子莞尔而笑曰：割鸡焉用牛刀？',t:'子游做武城长官。孔子到武城听到处处弦歌之声，微笑着说杀鸡何必用牛刀呢？',s:'阳货17.4'},
{o:'子游对曰：昔者偃也闻诸夫子曰：君子学道则爱人，小人学道则易使也。',t:'子游回答：从前我听夫子说过，君子学道就爱护百姓，百姓学道就容易役使。',s:'阳货17.4'},
{o:'子游问孝。子曰：今之孝者是谓能养。至于犬马皆能有养，不敬何以别乎？',t:'子游问孝。孔子说现在的孝只是养活父母。连狗马都有人养，没有敬意和养牲口有什么区别？',s:'为政2.7'},
{o:'子游曰：子夏之门人小子，当洒扫应对进退则可矣，抑末也。本之则无，如之何？',t:'子游说子夏的学生做洒水扫地、接待应答的小事还可以，但这是末节，根本没有根基。',s:'子张19.12'},
{o:'子游曰：丧致乎哀而止。',t:'子游说丧礼表达悲哀就够了，不要过分。',s:'子张19.14'},
{o:'大道之行也，天下为公。——《礼记·礼运》大同篇记录了孔子与子游的对话。',t:'大道实行时，天下是天下人共有的。这可能是子游记录的孔子最重要的一段话。',s:'礼运（礼记）'}
]},
{id:'minziqian',n:'闵子骞',ak:'闵损·子骞',ti:'德行科·孝子典范',e:'🧣',bg:'#37474f',st:{仁:4,义:3,礼:4,智:3,信:4,勇:2,政:2},ac:['🧊芦衣顺母','🛡️不做季氏家臣','🥈德行科颜回之后','❄️二十四孝','🫶孝哉闵子骞','🔇不语则已'],qs:[
{o:'孝哉闵子骞！人不间于其父母昆弟之言。',t:'闵子骞真孝顺啊！别人对他父母兄弟的称赞没有异议。',s:'先进11.5'},
{o:'闵子侍侧，訚訚如也。',t:'闵子骞侍立在孔子身旁，说话温和而正直。',s:'先进11.13'},
{o:'季氏使闵子骞为费宰。闵子骞曰：善为我辞焉。如有复我者，则吾必在汶上矣。',t:'季氏让闵子骞做费邑长官。他说好好替我推辞！再来找我，我就逃到汶水北边去了。',s:'雍也6.9'},
{o:'鲁人为长府。闵子骞曰：仍旧贯，如之何？何必改作？',t:'鲁国人要改建长府。闵子骞说保持原样怎么样？何必改建呢？',s:'先进11.14'},
{o:'夫人不言，言必有中。',t:'这个人不轻易说话，一开口必定说到点子上（孔子夸闵子骞）。',s:'先进11.14'}
]},
{id:'fanchi',n:'樊迟',ak:'樊须·子迟',ti:'好学善问·务实派',e:'🌾',bg:'#33691e',st:{仁:3,义:2,礼:3,智:3,信:3,勇:2,政:2},ac:['🌾请学稼被骂小人','❓最爱提问的弟子','🧠三问仁智','🚗曾为孔子驾车','📖好学不倦','❓问孝问崇德'],qs:[
{o:'樊迟请学稼。子曰：吾不如老农。请学为圃。曰：吾不如老圃。樊迟出。子曰：小人哉樊须也！',t:'樊迟请求学种庄稼，孔子说我不如老农。又请学种菜，孔子说我不如老菜农。樊迟走后孔子说樊须真是个小人！',s:'子路13.4'},
{o:'樊迟问仁。子曰：爱人。问知。子曰：知人。樊迟未达。',t:'樊迟问什么是仁。孔子说爱人。又问什么是智。孔子说了解人。樊迟没听懂。',s:'颜渊12.22'},
{o:'樊迟从游于舞雩之下，曰：敢问崇德修慝辨惑。子曰：善哉问！',t:'樊迟跟孔子在舞雩台下散步，问怎么提高品德、消除邪念、辨别迷惑。孔子说问得好！',s:'颜渊12.21'},
{o:'樊迟问仁。子曰：居处恭，执事敬，与人忠。虽之夷狄，不可弃也。',t:'樊迟问仁。孔子说平时恭敬、做事认真、待人忠心。就算到了野蛮地区，也不能丢弃。',s:'子路13.19'},
{o:'樊迟御。子告之曰：孟孙问孝于我，我对曰无违。',t:'樊迟给孔子驾车。孔子告诉他说孟孙问我孝，我说不要违背。',s:'为政2.5'},
{o:'樊迟问知。子曰：务民之义，敬鬼神而远之，可谓知矣。',t:'樊迟问什么是智。孔子说全力做对百姓合义的事，尊敬鬼神但保持距离，这就是智。',s:'雍也6.22'}
]},
{id:'simaniu',n:'司马牛',ak:'司马耕·子牛',ti:'多言而躁·忧惧之人',e:'😰',bg:'#795548',st:{仁:2,义:2,礼:2,智:2,信:2,勇:1,政:1},ac:['😟司马牛之忧','🗣️多言而躁','👤兄弟作乱牵连','🤝四海之内皆兄弟','❓多次问仁问君子','🏃‍♂️流亡弟子'],qs:[
{o:'司马牛问仁。子曰：仁者其言也讱。曰：其言也讱，斯谓之仁已乎？子曰：为之难，言之得无讱乎？',t:'司马牛问仁。孔子说仁者说话迟钝。司马牛说说话迟钝就算仁了吗？孔子说做到仁很难，说话能不迟钝吗？',s:'颜渊12.3'},
{o:'司马牛问君子。子曰：君子不忧不惧。曰：不忧不惧斯谓之君子已乎？子曰：内省不疚，夫何忧何惧？',t:'司马牛问什么是君子。孔子说不忧愁不恐惧。司马牛说这就够了吗？孔子说反省内心没有愧疚，还有什么好忧愁恐惧的？',s:'颜渊12.4'},
{o:'司马牛忧曰：人皆有兄弟，我独亡。子夏曰：……四海之内皆兄弟也，君子何患乎无兄弟也？',t:'司马牛忧愁地说别人都有兄弟，唯独我没有。子夏说四海之内都是兄弟，君子何必担心没有兄弟？',s:'颜渊12.5'},
{o:'司马牛致其邑与珪焉而适齐。',t:'司马牛交还了封邑和玉珪逃往齐国（因哥哥向魋叛乱牵连）。',s:'左传哀公十四年'}
]},
{id:'gongxihua',n:'公西华',ak:'公西赤·子华',ti:'外交礼仪·相礼专家',e:'🎩',bg:'#5e35b1',st:{仁:3,义:3,礼:5,智:4,信:3,勇:1,政:3},ac:['🎩束带立于朝','👔相礼专家','🚗乘肥马衣轻裘','📜可使与宾客言','🇨🇳出使齐国','🏛️礼仪外交担当'],qs:[
{o:'赤也，束带立于朝，可使与宾客言也，不知其仁也。',t:'公西赤，穿戴整齐站在朝廷上，可以让他和外宾交谈——但不知道他是否达到仁。',s:'公冶长5.8'},
{o:'赤之适齐也，乘肥马衣轻裘。吾闻之也，君子周急不继富。',t:'公西华出使齐国，骑着肥马穿着轻暖皮袍。孔子说君子救急不锦上添花（批评冉有给他家送太多米）。',s:'雍也6.4'},
{o:'子路、曾皙、冉有、公西华侍坐。……赤！尔何如？对曰：非曰能之，愿学焉。宗庙之事如会同，端章甫，愿为小相焉。',t:'公西华侍坐时被问到志向。他说不敢说能做到，愿意学习——宗庙祭祀、诸侯会盟，穿戴礼服礼帽做一个小司仪。',s:'先进11.26'},

function buildRoster(){
  const el=document.getElementById('roster');
  el.innerHTML=chars.map(c=>`<button class="roster-btn" data-id="${c.id}" onclick="sel('${c.id}')"><span class="icon" style="background:${c.bg}">${c.e}</span><span>${c.n}</span></button>`).join('');
}

function sel(id){
  const c=chars.find(x=>x.id===id);
  document.querySelectorAll('.roster-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.roster-btn[data-id="${id}"]`)?.classList.add('active');
  document.getElementById('charHeader').innerHTML=`<div class="char-avatar" style="background:${c.bg}">${c.e}</div><div class="char-info"><h2>${c.n}</h2><div class="titles">${c.ti}</div><div class="aka">${c.ak}</div></div>`;
  drawRadar(c);
  document.getElementById('statBars').innerHTML=SK.map(k=>`<div class="stat-row"><span class="stat-label">${k}</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${c.st[k]*20}%;background:${C[k]}"></div></div><span class="stat-val">${c.st[k]}</span></div>`).join('');
  document.getElementById('quotes').innerHTML=`<div class="section-title">📜 经典语录（${c.qs.length}条）</div>${c.qs.map(q=>`<div class="quote-item"><div class="quote-src">📖 ${q.s}</div><div class="quote-original">${q.o}</div><div class="quote-trans">${q.t}</div></div>`).join('')}`;
  document.getElementById('achievements').innerHTML=`<div class="section-title">🏆 隐藏成就</div>${c.ac.map(a=>`<div class="ach">🔓 ${a}</div>`).join('')}`;
  document.querySelectorAll('#relSvg .node').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
}

function drawRadar(c){
  const R=90, cx=140, cy=120, N=7, angles=SK.map((_,i)=>-Math.PI/2+i*2*Math.PI/N),levels=5;
  let s=`<svg viewBox="0 0 280 240" width="260" height="220">`;
  for(let l=1;l<=levels;l++){const r=R*l/levels;s+=`<polygon points="${angles.map(a=>`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`).join(' ')}" fill="none" stroke="rgba(205,133,63,0.15)" stroke-width="1"/>`;}
  angles.forEach(a=>s+=`<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="rgba(205,133,63,0.25)" stroke-width="1"/>`);
  angles.forEach((a,i)=>{const lr=R+16;s+=`<text x="${cx+lr*Math.cos(a)}" y="${cy+lr*Math.sin(a)+4}" fill="#a08070" font-size="12" text-anchor="middle">${SK[i]}</text>`;});
  const pts=angles.map((a,i)=>`${cx+(R*c.st[SK[i]]/5)*Math.cos(a)},${cy+(R*c.st[SK[i]]/5)*Math.sin(a)}`).join(' ');
  s+=`<polygon points="${pts}" fill="rgba(205,133,63,0.25)" stroke="#CD853F" stroke-width="2"/>`;
  angles.forEach((a,i)=>{const r=R*c.st[SK[i]]/5;s+=`<circle cx="${cx+r*Math.cos(a)}" cy="${cy+r*Math.sin(a)}" r="3.5" fill="#DEB887"/>`;});
  s+=`</svg>`;
  document.getElementById('radarSection').innerHTML=`<div class="section-title">🎯 属性雷达图</div>${s}`;
}

  const ns=[{id:'kongzi',x:140,y:0,l:'孔子',e:'👑'},{id:'yanhui',x:20,y:65,l:'颜回',e:'🌟'},{id:'zilu',x:260,y:60,l:'子路',e:'⚔️'},{id:'zigong',x:260,y:140,l:'子贡',e:'💰'},{id:'zengzi',x:200,y:200,l:'曾子',e:'🙏'},{id:'zixia',x:0,y:220,l:'子夏',e:'📜'},{id:'ranyou',x:60,y:160,l:'冉有',e:'🏛️'},{id:'zaiwo',x:260,y:220,l:'宰我',e:'😴'},{id:'zizhang',x:260,y:280,l:'子张',e:'🎯'},{id:'zhonggong',x:140,y:150,l:'仲弓',e:'🐂'},{id:'youzi',x:80,y:200,l:'有子',e:'🦅'},{id:'ziyou',x:0,y:160,l:'子游',e:'🎵'},{id:'minziqian',x:140,y:260,l:'闵子骞',e:'🧣'},{id:'fanchi',x:200,y:140,l:'樊迟',e:'🌾'},{id:'simaniu',x:0,y:120,l:'司马牛',e:'😰'},{id:'gongxihua',x:140,y:200,l:'公西华',e:'🎩'},{id:'yuanxian',x:0,y:280,l:'原宪',e:'🏚️'},{id:'zijian',x:200,y:260,l:'子贱',e:'🕊️'},{id:'qidiaokai',x:60,y:130,l:'漆雕开',e:'🚪'},{id:'nanrong',x:80,y:110,l:'南容',e:'🧧'}];
  const sv=document.getElementById('relSvg');
  let h='';
  ns.forEach(n=>{
    if(n.id!=='kongzi')h+=`<line x1="140" y1="0" x2="${n.x}" y2="${n.y}" stroke="rgba(205,133,63,0.15)" stroke-width="1"/>`;
  });
  ns.forEach(n=>{
    const a=n.id===activeId?' active':'';
    h+=`<g class="node${a}" data-id="${n.id}" onclick="sel('${n.id}')" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="18" fill="rgba(205,133,63,0.3)" stroke="rgba(205,133,63,0.6)" stroke-width="1.5"/><text x="${n.x}" y="${n.y-22}" font-size="14" fill="#DEB887" text-anchor="middle">${n.e}</text><text x="${n.x}" y="${n.y+30}" font-size="10" fill="#a08070" text-anchor="middle">${n.l}</text></g>`;
  });
  sv.innerHTML=h;
}

const cats=['全部','仁','礼','学','政','君子小人','天命','自述','教弟子'];

function filterSpeech(){
  const q=document.getElementById('speechSearch').value.toLowerCase();
  const activeCat=document.querySelector('#speechCats .scat-active')?.dataset.cat||'全部';
  const filtered=speeches.filter(s=>(activeCat==='全部'||s.c===activeCat)&&(s.o.includes(q)||s.t.includes(q)||s.s.includes(q)));
  renderSpeechGrid(filtered);
}

function renderSpeechGrid(data){
  document.getElementById('speechGrid').innerHTML=data.map(s=>`<div class="speech-card"><div class="s-src">📖 ${s.s}</div><div class="s-orig">${s.o}</div><div class="s-trans">${s.t}</div><span class="s-cat">#${s.c}</span></div>`).join('');
}

function buildSpeechCats(){
  const el=document.getElementById('speechCats');
  el.innerHTML=cats.map(c=>`<button data-cat="${c}" onclick="document.querySelectorAll('#speechCats button').forEach(b=>b.classList.remove('scat-active'));this.classList.add('scat-active');filterSpeech()" ${c==='全部'?'class="scat-active"':''}>${c==='全部'?'🔖 全部':'#'+c} (${c==='全部'?speeches.length:speeches.filter(s=>s.c===c).length})</button>`).join('');
}

function switchTab(tab,btn){
  document.getElementById('rosterView').style.display=tab==='roster'?'flex':'none';
  document.getElementById('speechView').classList.toggle('active',tab==='speech');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('nav-active'));
  if(btn!=='this')document.querySelectorAll('nav button')[tab==='roster'?0:1].classList.add('nav-active');
  else event.target.classList.add('nav-active');
}

buildRoster();
drawRelGraph('kongzi');
sel('kongzi');
buildSpeechCats();
renderSpeechGrid(speeches);
</script>
